name: Temporary compact objective paste fix

on:
  push:
    branches:
      - "fix/compact-objective-paste"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply compact objective parser fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/utils/autoMarking.js")
          source = source_path.read_text(encoding="utf-8")
          old = r'''function splitObjectiveAnswerTokens(text = "") {
            return String(text || "")
              .split(/\r?\n/)
              .flatMap((line) => line.split(/[,;]+/))
              .map((line) => line.trim())
              .filter(Boolean);
          }'''
          new = r'''function splitCompactNumberedObjectiveSequence(line = "") {
            const trimmed = String(line || "").trim();
            if (!trimmed) return [];

            const tokenPattern = new RegExp(
              `\\d{1,3}\\s*[).:-]?\\s*[${OBJECTIVE_OPTION_LETTERS}]\\s*[).:-]?(?=\\s|$)`,
              "gi",
            );
            const matches = [...trimmed.matchAll(tokenPattern)];
            if (matches.length < 2) return [trimmed];

            let cursor = 0;
            const unmatched = matches.reduce((remainder, match) => {
              const index = Number(match.index || 0);
              const gap = trimmed.slice(cursor, index);
              cursor = index + match[0].length;
              return remainder + gap;
            }, "") + trimmed.slice(cursor);

            if (unmatched.trim()) return [trimmed];
            return matches.map((match) => match[0].trim());
          }

          function splitObjectiveAnswerTokens(text = "") {
            return String(text || "")
              .split(/\r?\n/)
              .flatMap((line) => line.split(/[,;]+/))
              .flatMap((line) => splitCompactNumberedObjectiveSequence(line))
              .map((line) => line.trim())
              .filter(Boolean);
          }'''

          if old not in source:
              raise SystemExit("Expected splitObjectiveAnswerTokens implementation not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/compact-objective-paste.test.js")
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { checkDeterministicObjectiveAnswers } from "../src/utils/autoMarking.js";

          test("deterministic checker expands compact pasted B1 Teil 3 and Teil 4 answer rows", () => {
            const result = checkDeterministicObjectiveAnswers({
              referenceEntry: {
                assignmentKey: "B1-2.5",
                level: "B1",
                answers: `teil3: Answer1. B) Am Samstag um 14:00 Uhr
          teil3: Answer2. B) Hell und geraumig
          teil3: Answer3. B) Die Badewanne
          teil3: Answer4. B) Zwei Monatsmieten
          teil3: Answer5. A) Ab dem ersten des nachsten Monats
          teil3: Answer6. B) Ein Jahr
          teil3: Answer7. C) Sie entschied sich, die Wohnung zu mieten
          teil4: Answer1. A) Am fruhen Morgen
          teil4: Answer2. B) Der Vermieter spart Zeit
          teil4: Answer3. B) Auf das Umfeld und die Nachbarschaft
          teil4: Answer4. C) Weil die Wohung schnell vergeben sein konnte
          teil4: Answer5. B) Gehaltsnachweise und Mieterselbstauskunft`,
              },
              submissionText: `Teil 2 : Schreiben

          Sehr geehrte Damen und Herren,

          ich habe Ihre Wohnungsanzeige im Internet gesehen und interessiere mich sehr für die angebotene Wohnung. Gern würde ich sie persönlich besichtigen. Wäre ein Termin am Freitag um 16 Uhr möglich? Alternativ könnte ich am Samstagvormittag kommen.

          Bitte bestätigen Sie mir den Termin und teilen Sie mir die genaue Adresse mit. Außerdem möchte ich gern wissen, welche Unterlagen ich zur Besichtigung mitbringen soll.

          Vielen Dank im Voraus. Ich freue mich auf Ihre Rückmeldung.

          Mit freundlichen Grüßen
          Ruth

          Teil 3 : Lesen
          1B 2B 3B 4B 5A 6B 7C

          Teil 4 : Hören
          1A 2B 3B 4C 5B`,
            });

            assert.equal(result.objectiveScore, 100);
            assert.equal(result.objectiveCorrect, 12);
            assert.equal(result.objectiveTotal, 12);
            assert.deepEqual(result.wrongAnswers, []);
            assert.equal(result.detectedParts[0].summary, "teil3: 7 objective answers found, 7 correct, 0 wrong");
            assert.equal(result.detectedParts[1].summary, "teil4: 5 objective answers found, 5 correct, 0 wrong");
          });

          test("compact answer splitting does not reinterpret numbered text answers", () => {
            const result = checkDeterministicObjectiveAnswers({
              referenceEntry: {
                format: "objective",
                answers: {
                  Answer1: "B) Berlin",
                  Answer2: "10 Euro",
                },
              },
              submissionText: "1: B\n2: 10 Euro",
            });

            assert.equal(result.objectiveScore, 100);
            assert.equal(result.objectiveCorrect, 2);
            assert.equal(result.objectiveTotal, 2);
          });
          '''.replace("          ", ""), encoding="utf-8")
          PY

      - name: Run objective parser tests
        run: node --test tests/compact-objective-paste.test.js tests/auto-marking.test.js

      - name: Commit parser fix and regression test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/autoMarking.js tests/compact-objective-paste.test.js
          git diff --cached --check
          git commit -m "Fix compact objective answer pastes"
          git push origin HEAD:"${GITHUB_REF_NAME}"
