name: Materialize placeholder writing classification

on:
  push:
    branches:
      - improve/marking-foundation
    paths:
      - '.github/workflows/materialize-placeholder-writing.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/marking-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit placeholder writing classification into objective source
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/utils/objectiveMarking.js')
          source = path.read_text()
          anchor = 'function isWritingPart(referenceEntry = {}, partId = "main") {\n  const normalizedPartId = normalizePartId(partId);'
          replacement = '''function isWritingPart(referenceEntry = {}, partId = "main") {\n  const normalizedPartId = normalizePartId(partId);\n  const rawAnswers = referenceEntry.rawAnswers || referenceEntry.answers || {};\n  const answerValues = Object.values(rawAnswers).map((value) => String(value || "").trim().toLowerCase());\n  const writingPlaceholder = answerValues.length > 0 && answerValues.every((value) => /^(read|see|check) (the )?(comment|comments|instructions?)( for (the )?answers?)?$/.test(value));\n  if (normalizedPartId === "main" && writingPlaceholder) return true;'''
          if replacement not in source:
              if anchor not in source:
                  raise SystemExit('isWritingPart anchor not found')
              source = source.replace(anchor, replacement, 1)
              path.write_text(source)
          PY
      - run: node --check src/utils/objectiveMarking.js
      - name: Commit objective source
        run: |
          if git diff --quiet -- src/utils/objectiveMarking.js; then
            echo "No placeholder classification change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js
          git commit -m "Materialize placeholder writing classification"
          git push origin HEAD:improve/marking-foundation
