name: Patch B1 Day 19 marking contract

on:
  push:
    branches:
      - fix/b1-day19-murten-marking-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b1-day19-murten-marking-contract
      - name: Correct Day 19 teacher data and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('src/data/b1WorkbookAlignedSlidesDays11To20.js')
          text = data_path.read_text()
          replacements = {
            '"Important workbook exception: Teil 3 is Feldheim green-energy reading, and Teil 4 has no audio at all—it is a second reading about a tour through Murten\'s history.",': '"Important marking exception: Teil 3 contains both reading texts—Feldheim is questions 1–3 and Murten is questions 4–6. Teil 4 has no audio, is excluded from scoring and must not be submitted.",',
            '{ phase: "Workbook bridge", detailEn: "8 min: plan the Emma opinion and explicitly preview the two unrelated reading-based comprehension tasks." },': '{ phase: "Workbook bridge", detailEn: "8 min: plan the Emma opinion and preview both unrelated reading texts, making clear that all six objective answers belong to Teil 3." },',
            '{ label: "Teil 3 · Lesen", detailEn: "Separate reading assignment: ‘Ein Dorf für grüne Energie’ about Feldheim, biogas, renewable energy, surplus electricity and the importance of active residents; answer questions 1–3." },': '{ label: "Teil 3 · Lesen", detailEn: "Scored reading assignment with TWO texts: questions 1–3 use ‘Ein Dorf für grüne Energie’ (Feldheim, biogas, renewable energy, surplus electricity and active residents); questions 4–6 use ‘Tour durch Murtens Geschichte’. Submit all six answer letters under Teil 3." },',
            '{ label: "Teil 4 · Hören", detailEn: "NO HÖREN MEDIUM was supplied. Teil 4 is actually a second reading task, ‘Tour durch Murtens Geschichte’, with questions 4–6. Submit those reading answer letters as Teil 4." },': '{ label: "Teil 4 · Hören", detailEn: "NO SCORED TEIL 4. No Hören medium was supplied, Teil 4 is excluded by the marking contract, and nothing should be submitted under Teil 4. Murten answers 4–6 belong to Teil 3." },',
            'subtitle: "Teach toward the workbook tasks, but note the Day 19 exception: Teil 4 has no audio and is a second Lesen task.",': 'subtitle: "Day 19 marking contract: Teil 3 contains both Feldheim (1–3) and Murten (4–6). Teil 4 has no audio, is excluded and must not be submitted.",',
            'lessonOverviewEn: "Day 19 teaches interview register and professional self-presentation. The production lesson is coherent, but the workbook comprehension section deliberately/operationally shifts to two unrelated reading texts, including a Teil 4 slot with no audio.",': 'lessonOverviewEn: "Day 19 teaches interview register and professional self-presentation. The comprehension work shifts to two unrelated reading texts, but the marking contract scores both under Teil 3: Feldheim as answers 1–3 and Murten as answers 4–6. Teil 4 is excluded and has no audio.",',
            '"Trying to invent or play audio for Teil 4 instead of treating it as the second reading task supplied by the workbook.",': '"Submitting the Murten answers as Teil 4 instead of keeping answers 4–6 under Teil 3; Teil 4 is excluded from scoring.",',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected data text: {old}')
            text = text.replace(old, new, 1)
          data_path.write_text(text)

          test_path = Path('tests/b1-workbook-aligned-slides-days11-20.test.js')
          test = test_path.read_text()
          old = '''test("Day 19 records that Teil 4 has no Hören medium and is a second Lesen task", () => {\n  const slide = getB1WorkbookAlignedSlideDay11To20("B1-6.19");\n  const reading = part(slide, "Teil 3 · Lesen").detailEn;\n  const listeningSlot = part(slide, "Teil 4 · Hören").detailEn;\n\n  assert.match(reading, /Feldheim/i);\n  assert.match(reading, /green energy|grüne Energie/i);\n  assert.match(listeningSlot, /NO HÖREN MEDIUM/i);\n  assert.match(listeningSlot, /second reading/i);\n  assert.match(listeningSlot, /Murten/i);\n  assert.match(slide.workbookConnection.subtitle, /no audio/i);\n});'''
          new = '''test("Day 19 keeps both reading texts in scored Teil 3 and excludes Teil 4", () => {\n  const slide = getB1WorkbookAlignedSlideDay11To20("B1-6.19");\n  const reading = part(slide, "Teil 3 · Lesen").detailEn;\n  const listeningSlot = part(slide, "Teil 4 · Hören").detailEn;\n\n  assert.match(reading, /Feldheim/i);\n  assert.match(reading, /Murten/i);\n  assert.match(reading, /questions 1–3|questions 1-3/i);\n  assert.match(reading, /questions 4–6|questions 4-6/i);\n  assert.match(reading, /under Teil 3/i);\n  assert.match(listeningSlot, /NO SCORED TEIL 4/i);\n  assert.match(listeningSlot, /excluded/i);\n  assert.match(listeningSlot, /nothing should be submitted/i);\n  assert.match(listeningSlot, /Murten answers 4–6 belong to Teil 3|Murten answers 4-6 belong to Teil 3/i);\n  assert.match(slide.workbookConnection.subtitle, /Teil 3 contains both/i);\n  assert.match(slide.workbookConnection.subtitle, /Teil 4.*excluded/i);\n});'''
          if old not in test:
            raise SystemExit('Missing expected Day 19 regression block')
          test_path.write_text(test.replace(old, new, 1))
          PY
      - name: Verify focused regression
        run: node --test tests/b1-workbook-aligned-slides-days11-20.test.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/b1WorkbookAlignedSlidesDays11To20.js tests/b1-workbook-aligned-slides-days11-20.test.js
          git commit -m "Keep B1 Day 19 Murten answers in Teil 3"
          git push origin HEAD:fix/b1-day19-murten-marking-contract
