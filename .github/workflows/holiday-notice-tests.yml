name: Holiday Notice Tests

on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'functions/holidayNoticeRules.js'
      - 'apps-script/holiday-calendar-webapp.gs'
      - 'src/pages/HolidayCalendarPage.jsx'
      - 'src/services/holidayCalendarService.js'
      - 'tests/holiday-notice-rules.test.js'
      - '.github/workflows/deploy-holiday-apps-script.yml'
      - '.github/workflows/holiday-notice-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/index.js'
      - 'functions/holidayNoticeRules.js'
      - 'apps-script/holiday-calendar-webapp.gs'
      - 'src/pages/HolidayCalendarPage.jsx'
      - 'src/services/holidayCalendarService.js'
      - 'tests/holiday-notice-rules.test.js'
      - '.github/workflows/deploy-holiday-apps-script.yml'
      - '.github/workflows/holiday-notice-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test holiday notice rules
        run: node --test tests/holiday-notice-rules.test.js
      - name: Validate holiday deployment guard
        run: node scripts/patchHolidayClassScheduleAwareness.mjs
      - name: Validate functions syntax
        run: |
          node --check functions/holidayNoticeRules.js
          node --check functions/index.js
      - name: Build dashboard
        run: npm run build
