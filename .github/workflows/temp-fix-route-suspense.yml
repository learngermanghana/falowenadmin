name: Repair route suspense wrapper and validate tests

on:
  push:
    branches:
      - fix/richer-writing-feedback-mobile-load

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/richer-writing-feedback-mobile-load
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair App suspense wrapper
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/App.jsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '        <Suspense fallback={<RouteFallback />}>\n          <Suspense fallback={<RouteFallback />}>\n          <Routes>',
            '        <Suspense fallback={<RouteFallback />}>\n          <Routes>',
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run writing feedback regressions
        run: node --test tests/rich-writing-feedback.test.js tests/b1-writing-feedback-depth.test.js tests/b1-2-4-answer-key-count.test.js
      - name: Build
        run: npm run build
      - name: Commit repair
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'App already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Fix lazy-route suspense wrapper'
          git push origin HEAD:fix/richer-writing-feedback-mobile-load
