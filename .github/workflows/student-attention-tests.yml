name: Student Attention Tests

on:
  pull_request:
    paths:
      - "src/pages/StudentDirectoryPage.jsx"
      - "src/pages/DashboardPage.jsx"
      - "src/pages/DashboardPage.css"
      - "src/components/StudentLearningStatusPanel.jsx"
      - "src/utils/studentAttention.js"
      - "tests/student-attention.test.js"
      - "tests/student-attention-integration.test.js"
      - ".github/workflows/student-attention-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test attention rules and placement
        run: node --test tests/student-attention.test.js tests/student-attention-integration.test.js

      - name: Build Falowen Admin
        run: npm run build
