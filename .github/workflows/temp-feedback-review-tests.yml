name: Temporary feedback review tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  feedback-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/essay-feedback-evidence.test.js tests/rich-writing-feedback.test.js tests/b1-writing-feedback-depth.test.js
