name: Essay Feedback Tests

on:
  pull_request:
    paths:
      - 'src/pages/MarkingPage.jsx'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'src/utils/finalDeterministicFeedback.js'
      - 'scripts/patchSmartMarkingNaturalFeedback.mjs'
      - 'tests/essay-feedback-evidence.test.js'
      - 'tests/final-deterministic-feedback.test.js'
      - 'tests/marking-intelligence.test.js'
      - 'tests/marking-review-findings.test.js'
      - '.github/workflows/essay-feedback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/pages/MarkingPage.jsx'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'src/utils/finalDeterministicFeedback.js'
      - 'scripts/patchSmartMarkingNaturalFeedback.mjs'
      - 'tests/essay-feedback-evidence.test.js'
      - 'tests/final-deterministic-feedback.test.js'
      - 'tests/marking-intelligence.test.js'
      - 'tests/marking-review-findings.test.js'
      - '.github/workflows/essay-feedback-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check feedback modules and patch script
        run: |
          node --check src/utils/naturalMarkingFeedback.js
          node --check src/utils/essayFeedbackEvidence.js
          node --check src/utils/finalDeterministicFeedback.js
          node --check scripts/patchSmartMarkingNaturalFeedback.mjs
          node --check tests/final-deterministic-feedback.test.js
          node --check tests/marking-review-findings.test.js
      - name: Apply production marking patches
        run: |
          node scripts/patchSmartMarkingNaturalFeedback.mjs
          grep -F 'import { reconcileFinalDeterministicFeedback } from "../utils/finalDeterministicFeedback.js";' src/pages/MarkingPage.jsx
          grep -F 'mergeObjectiveScore(aiResult, deterministicObjective, submissionText)' src/pages/MarkingPage.jsx
          grep -F '}, objectiveResult, submissionText);' src/pages/MarkingPage.jsx
      - name: Test A1-9 final feedback reconciliation
        run: node --test --test-name-pattern="A1-9 final" tests/final-deterministic-feedback.test.js
      - name: Test A1-0.2 perfect feedback reconciliation
        run: node --test --test-name-pattern="A1-0.2 perfect" tests/final-deterministic-feedback.test.js
      - name: Test marking intelligence
        run: node --test tests/marking-intelligence.test.js
      - name: Test essay feedback evidence
        run: node --test tests/essay-feedback-evidence.test.js
      - name: Test missing objective count fallback
        run: node --test --test-name-pattern="missing objectiveCorrect" tests/marking-review-findings.test.js
      - name: Test explicit zero count
        run: node --test --test-name-pattern="explicit zero" tests/marking-review-findings.test.js
      - name: Test correction priority
        run: node --test --test-name-pattern="exact writing correction" tests/marking-review-findings.test.js
      - name: Test legacy writing eligibility
        run: node --test --test-name-pattern="legacy imported" tests/marking-review-findings.test.js
