name: Essay Feedback Tests

on:
  pull_request:
    paths:
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchSmartMarkingNaturalFeedback.mjs'
      - 'tests/essay-feedback-evidence.test.js'
      - 'tests/marking-intelligence.test.js'
      - 'tests/marking-review-findings.test.js'
      - '.github/workflows/essay-feedback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchSmartMarkingNaturalFeedback.mjs'
      - 'tests/essay-feedback-evidence.test.js'
      - 'tests/marking-intelligence.test.js'
      - 'tests/marking-review-findings.test.js'
      - '.github/workflows/essay-feedback-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check feedback modules and patch script
        run: |
          node --check src/utils/naturalMarkingFeedback.js
          node --check src/utils/essayFeedbackEvidence.js
          node --check scripts/patchSmartMarkingNaturalFeedback.mjs
          node --check tests/marking-review-findings.test.js
      - name: Test marking intelligence
        run: node --test tests/marking-intelligence.test.js
      - name: Test essay feedback evidence
        run: node --test tests/essay-feedback-evidence.test.js
      - name: Test review findings
        run: node --test tests/marking-review-findings.test.js
