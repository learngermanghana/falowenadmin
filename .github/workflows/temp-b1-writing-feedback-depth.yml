name: Temporary B1 writing feedback depth

on:
  push:
    branches:
      - fix/b1-writing-feedback-depth

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b1-writing-feedback-depth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply B1 feedback patch
        run: node scripts/patchB1WritingFeedbackDepth.mjs
      - name: Validate source
        run: |
          node --check src/utils/essayFeedbackEvidence.js
          node --check src/utils/feedbackPolicy.js
      - name: Run feedback regressions
        run: node --test tests/b1-writing-feedback-depth.test.js tests/marking-review-findings.test.js tests/feedback-policy.test.js
      - name: Commit verified source and remove temporary workflow
        run: |
          rm .github/workflows/temp-b1-writing-feedback-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/essayFeedbackEvidence.js src/utils/feedbackPolicy.js .github/workflows/temp-b1-writing-feedback-depth.yml
          git commit -m "Strengthen B1 writing feedback"
          git push origin HEAD:fix/b1-writing-feedback-depth
