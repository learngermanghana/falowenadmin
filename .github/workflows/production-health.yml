name: Production deployment health

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falowen-admin-production-health
  cancel-in-progress: true

jobs:
  production-build-gate:
    name: Production build gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error

      - name: Run the same production build command Vercel uses
        env:
          CI: true
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run build

      - name: Show generated build identity
        run: cat public/__falowen-admin-build.json

  verify-live-production:
    name: Verify live production SHA
    needs: production-build-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production verifier
        uses: actions/checkout@v4

      - name: Wait for admin.falowen.app to match main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_HEALTH_TIMEOUT_MS: 900000
          PRODUCTION_HEALTH_INTERVAL_MS: 15000
        run: node scripts/checkProductionIdentity.mjs
