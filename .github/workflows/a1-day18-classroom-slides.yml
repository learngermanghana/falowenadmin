name: A1 Day 18 two-way prepositions slides
on:
  pull_request:
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/A1Day18ClassroomStage.*"
      - "src/data/a1Day18Classroom.js"
      - "src/data/a1Days16To20Slides.js"
      - "tests/a1-day18-classroom-slides.test.js"
      - ".github/workflows/a1-day18-classroom-slides.yml"
  workflow_dispatch:
jobs:
  day18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Compile Day 18 JSX
        run: |
          node --input-type=module -e "import { transformWithEsbuild } from 'vite'; import { readFileSync } from 'node:fs'; for (const file of ['src/components/A1Day18ClassroomStage.jsx','src/components/A1GrammarPresenter.jsx']) { await transformWithEsbuild(readFileSync(file, 'utf8'), file, { loader: 'jsx', jsx: 'automatic' }); console.log(file + ' JSX syntax OK'); }"
      - name: Verify Day 18 lesson and existing workbook connection
        run: node --test tests/a1-day18-classroom-slides.test.js tests/a1-days16-to20-understanding.test.js
