name: Marking parser regressions

on:
  push:
    paths:
      - 'scripts/patchA1BooleanOptionNormalization.mjs'
      - 'scripts/patchObjectiveTeil2ReviewMapping.mjs'
      - 'tests/a1-10-letter-boolean-parser.test.js'
      - '.github/workflows/marking-parser-regressions.yml'
  pull_request:
    paths:
      - 'scripts/patchA1BooleanOptionNormalization.mjs'
      - 'scripts/patchObjectiveTeil2ReviewMapping.mjs'
      - 'tests/a1-10-letter-boolean-parser.test.js'
      - '.github/workflows/marking-parser-regressions.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply current A1 objective lifecycle twice
        run: |
          node scripts/patchObjectiveTeil2ReviewMapping.mjs
          node scripts/patchObjectiveTeil2ReviewMapping.mjs
      - name: Validate patched source
        run: |
          node --check src/utils/autoMarking.js
          node --check scripts/patchA1BooleanOptionNormalization.mjs
          grep -F '// A1 BOOLEAN OPTION NORMALIZATION' src/utils/autoMarking.js
      - name: Run exact A1-10 regression
        run: node --test tests/a1-10-letter-boolean-parser.test.js
