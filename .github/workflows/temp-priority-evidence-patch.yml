name: Temporary evidence ordering patch

on:
  push:
    branches:
      - fix/structured-feedback-priority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-feedback-priority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve specific evidence before heuristics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/utils/essayFeedbackEvidence.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  const optionalSentences = [\n    structuredStrength && !genericWritingSentence(structuredStrength) ? structuredStrength : "",\n    taskSentence(result),\n    structuredNextStep,\n    ...writingDepthSentences(result, submissionText, level),\n    strengthOf(result, submissionText, level, seed, history),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];`;
          const newBlock = `  const specificStrength = specificAiWritingSentence(result, "strength", submissionText);\n  const specificNextStep = specificAiWritingSentence(result, "next", submissionText);\n  const anchoredStrength = submissionAnchoredStrength(submissionText);\n  const anchoredNextStep = submissionAnchoredNextStep(submissionText);\n  const optionalSentences = [\n    structuredStrength && !genericWritingSentence(structuredStrength) ? structuredStrength : "",\n    taskSentence(result),\n    structuredNextStep,\n    specificStrength,\n    specificNextStep,\n    anchoredStrength,\n    anchoredNextStep,\n    ...writingDepthSentences(result, submissionText, level),\n    strengthOf(result, submissionText, level, seed, history),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];`;
          if (!source.includes(newBlock)) {
            if (!source.includes(oldBlock)) throw new Error('optional evidence block anchor changed');
            source = source.replace(oldBlock, newBlock);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet -- src/utils/essayFeedbackEvidence.js; then
            echo 'Already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/essayFeedbackEvidence.js
          git commit -m 'Keep specific writing evidence before heuristics'
          git push origin HEAD:fix/structured-feedback-priority
