name: Temp Normalize B2 C1 Hotfix

on:
  push:
    branches:
      - agent/fix-b2-dictionary-c1-chapter
    paths:
      - .github/workflows/temp-normalize-b2-c1-hotfix.yml

permissions:
  contents: write

jobs:
  normalize-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-b2-dictionary-c1-chapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore base files and apply byte-preserving edits
        run: |
          git fetch origin main
          git checkout origin/main -- functions/index.js src/pages/CanonicalAttendancePageV2.jsx src/pages/CanonicalAttendancePageV3.jsx
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('functions/index.js')
          data = p.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          require_line = b'const { parseAssignmentChapter } = require("./assignmentChapter.js");'
          if require_line not in data:
              anchor = b'const crypto = require("crypto");' + nl
              if anchor not in data:
                  raise SystemExit('crypto require anchor not found')
              data = data.replace(anchor, anchor + require_line + nl, 1)
          parser = re.compile(
              rb'function parseAssignmentChapter\(assignmentId\) \{\r?\n'
              rb'  const normalized = String\(assignmentId \|\| ""\)\.trim\(\);\r?\n'
              rb'  const parts = normalized\.split\("-"\);\r?\n'
              rb'  return parts\.length > 1 \? String\(parts\.slice\(1\)\.join\("-"\)\)\.trim\(\) : "";\r?\n'
              rb'\}\r?\n\r?\n'
          )
          data, count = parser.subn(b'', data, count=1)
          if count != 1:
              raise SystemExit(f'functions/index parser replacements: {count}')
          p.write_bytes(data)

          for name in ['src/pages/CanonicalAttendancePageV2.jsx', 'src/pages/CanonicalAttendancePageV3.jsx']:
              p = Path(name)
              data = p.read_bytes()
              nl = b'\r\n' if b'\r\n' in data else b'\n'
              import_line = b'import { parseAssignmentChapter } from "../utils/assignmentChapter.js";'
              if import_line not in data:
                  data = import_line + nl + data
              old = b'assignmentId.split("-").slice(1).join("-")'
              if old not in data:
                  raise SystemExit(f'chapter expression not found in {name}')
              data = data.replace(old, b'parseAssignmentChapter(assignmentId)', 1)
              p.write_bytes(data)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Re-run hotfix regressions
        run: node --test tests/b2-c1-liveclass-regressions.test.js tests/course-session-groups.test.js tests/live-class-session-picker.test.js tests/c1-presenter-v2-all-days.test.js tests/b2-presenter-v2-all-days.test.js tests/teaching-presenter.test.js
      - name: Build Falowen Admin
        run: npm run build
      - name: Commit normalized hotfix
        run: |
          git config user.name "learngermanghana"
          git config user.email "learngermanghana@gmail.com"
          git add functions/index.js src/pages/CanonicalAttendancePageV2.jsx src/pages/CanonicalAttendancePageV3.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep B2 C1 hotfix diff minimal"
          git push origin HEAD:agent/fix-b2-dictionary-c1-chapter
