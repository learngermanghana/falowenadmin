name: Upcoming Class Brochure Share Tests

on:
  pull_request:
    paths:
      - 'src/components/BrochureWhatsappPanel.jsx'
      - 'src/utils/brochureWhatsapp.js'
      - 'src/services/classesService.js'
      - 'tests/brochure-whatsapp.test.js'
      - '.github/workflows/brochure-share-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/BrochureWhatsappPanel.jsx'
      - 'src/utils/brochureWhatsapp.js'
      - 'src/services/classesService.js'
      - 'tests/brochure-whatsapp.test.js'
      - '.github/workflows/brochure-share-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run brochure sharing regressions
        run: node --test tests/brochure-whatsapp.test.js
      - name: Build Admin
        run: npm run build
