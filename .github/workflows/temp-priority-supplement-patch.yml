name: Temporary priority supplemental patch

on:
  push:
    branches:
      - fix/structured-feedback-priority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-feedback-priority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep heuristics supplemental to authoritative evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/utils/essayFeedbackEvidence.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  const optionalSentences = [\n    priorityStrength,\n    priorityTask,\n    priorityNextStep,\n    specificStrength,\n    specificNextStep,\n    specificAnchoredStrength,\n    anchoredNextStep,\n    ...writingDepthSentences(result, submissionText, level),\n    anchoredStrength,\n    strengthOf(result, submissionText, level, seed, history),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];\n  const hasPriorityWritingEvidence = Boolean(\n    priorityStrength\n    || priorityTask\n    || priorityNextStep\n    || specificStrength\n    || specificNextStep\n    || specificAnchoredStrength\n    || anchoredNextStep,\n  );\n  const feedbackMaximum = hasPriorityWritingEvidence\n    ? level === "B1" ? 75 : 60\n    : level === "B1" ? 120 : level === "A2" ? 100 : 60;`;
          const newBlock = `  const hasPriorityWritingEvidence = Boolean(\n    priorityStrength\n    || priorityTask\n    || priorityNextStep\n    || specificStrength\n    || specificNextStep\n    || specificAnchoredStrength\n    || anchoredNextStep,\n  );\n  const fallbackStrength = priorityStrength || specificStrength || specificAnchoredStrength\n    ? ""\n    : strengthOf(result, submissionText, level, seed, history);\n  const fallbackNextStep = priorityNextStep || specificNextStep || anchoredNextStep\n    ? ""\n    : nextStepOf(result, submissionText, level, correction, seed, history);\n  const supplementalSentences = hasPriorityWritingEvidence\n    ? [fallbackStrength, fallbackNextStep]\n    : [\n      ...writingDepthSentences(result, submissionText, level),\n      fallbackStrength,\n      fallbackNextStep,\n    ];\n  const optionalSentences = [\n    priorityStrength,\n    priorityTask,\n    priorityNextStep,\n    specificStrength,\n    specificNextStep,\n    priorityStrength || specificStrength ? "" : specificAnchoredStrength,\n    anchoredNextStep,\n    ...supplementalSentences,\n  ];\n  const feedbackMaximum = hasPriorityWritingEvidence\n    ? level === "B1" ? 90 : level === "A2" ? 75 : 60\n    : level === "B1" ? 120 : level === "A2" ? 100 : 60;`;
          if (!source.includes(newBlock)) {
            if (!source.includes(oldBlock)) throw new Error('priority supplemental block anchor changed');
            source = source.replace(oldBlock, newBlock);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet -- src/utils/essayFeedbackEvidence.js; then
            echo 'Already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/essayFeedbackEvidence.js
          git commit -m 'Keep writing heuristics supplemental to evidence'
          git push origin HEAD:fix/structured-feedback-priority
