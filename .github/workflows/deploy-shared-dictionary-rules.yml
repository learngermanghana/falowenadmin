name: Deploy Falowen Admin Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - ".github/workflows/deploy-shared-dictionary-rules.yml"
      - "scripts/verifyFirestoreRulesBaseline.mjs"
      - "scripts/deployFirestoreRules.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falowenadmin-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical Falowen course rules
        run: git clone --depth 1 https://github.com/learngermanghana/falowenexamtrainer.git "$RUNNER_TEMP/falowenexamtrainer"
      - name: Verify complete production rules are preserved
        run: node scripts/verifyFirestoreRulesBaseline.mjs "$RUNNER_TEMP/falowenexamtrainer/firestore.rules" firestore.rules
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}"
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "$FIREBASE_PROJECT_ID"
      - name: Create and publish Firestore ruleset
        run: node scripts/deployFirestoreRules.mjs
