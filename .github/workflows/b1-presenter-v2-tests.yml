name: B1+B2 Presenter 2.0 Tests

on:
  pull_request:
    paths:
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "src/utils/teachingPresenter.js"
      - "src/data/teachingSlides.js"
      - "src/data/b2PresenterSlides.js"
      - "src/data/b1WorkbookAlignedSlidesDays1To10.js"
      - "src/data/b1WorkbookAlignedSlidesDays11To20.js"
      - "src/data/b1WorkbookAlignedSlidesDays21To28.js"
      - "tests/b1-presenter-v2-days1-6.test.js"
      - "tests/b1-presenter-v2-all-days.test.js"
      - "tests/b2-presenter-v2-all-days.test.js"
      - "tests/b1-workbook-aligned-slides-days1-10.test.js"
      - "tests/b1-workbook-aligned-slides-days11-20.test.js"
      - "tests/b1-workbook-aligned-slides-days21-28.test.js"
      - ".github/workflows/b1-presenter-v2-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test complete B1 and B2 Presenter 2.0 rollout
        run: node --test tests/b1-presenter-v2-days1-6.test.js tests/b1-presenter-v2-all-days.test.js tests/b2-presenter-v2-all-days.test.js tests/teaching-presenter.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/b1-workbook-aligned-slides-days11-20.test.js tests/b1-workbook-aligned-slides-days21-28.test.js

      - name: Build Falowen Admin
        run: npm run build
