name: Validate and deploy Firestore rules
on:
  push:
    branches: [main]
    paths: ['firestore.rules', '.github/workflows/deploy-firestore-rules.yml']
  workflow_dispatch:
concurrency:
  group: falowenadmin-firestore-rules
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules tools
        run: npm install --prefix "$RUNNER_TEMP/falowen-rules-tests" --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: Verify staff and student permissions
        env:
          NODE_PATH: ${{ runner.temp }}/falowen-rules-tests/node_modules
        run: '"$RUNNER_TEMP/falowen-rules-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-falowen-staff ''node --test tests/firestore-staff-access.test.cjs'''
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'
      - name: Deploy verified rules
        run: |
          if ! "$RUNNER_TEMP/falowen-rules-tests/node_modules/.bin/firebase" deploy --only firestore:rules --project falowen-examiner-trainer --non-interactive > "$RUNNER_TEMP/firestore-deploy.log" 2>&1; then
            cat "$RUNNER_TEMP/firestore-deploy.log"
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -15 "$RUNNER_TEMP/firestore-deploy.log")
            exit 1
          fi
          cat "$RUNNER_TEMP/firestore-deploy.log"
