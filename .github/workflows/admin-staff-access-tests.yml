name: Admin staff Firestore access
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-staff-access.test.cjs'
      - '.github/workflows/admin-staff-access-tests.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated rules test tools
        run: npm install --prefix "$RUNNER_TEMP/falowen-rules-tests" --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: Check role permissions in the local emulator
        env:
          NODE_PATH: ${{ runner.temp }}/falowen-rules-tests/node_modules
        run: |
          "$RUNNER_TEMP/falowen-rules-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-falowen-staff 'node --test tests/firestore-staff-access.test.cjs'
