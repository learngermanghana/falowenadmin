name: Temporary priority evidence budget patch

on:
  push:
    branches:
      - fix/structured-feedback-priority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-feedback-priority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep authoritative feedback concise before fallback depth
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/utils/essayFeedbackEvidence.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  const specificStrength = specificAiWritingSentence(result, "strength", submissionText);\n  const specificNextStep = specificAiWritingSentence(result, "next", submissionText);\n  const anchoredStrength = submissionAnchoredStrength(submissionText);\n  const anchoredNextStep = submissionAnchoredNextStep(submissionText);\n  const optionalSentences = [\n    structuredStrength && !genericWritingSentence(structuredStrength) ? structuredStrength : "",\n    taskSentence(result),\n    structuredNextStep,\n    specificStrength,\n    specificNextStep,\n    anchoredStrength,\n    anchoredNextStep,\n    ...writingDepthSentences(result, submissionText, level),\n    strengthOf(result, submissionText, level, seed, history),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];`;
          const newBlock = `  const priorityStrength = structuredStrength && !genericWritingSentence(structuredStrength) ? structuredStrength : "";\n  const priorityTask = taskSentence(result);\n  const specificStrength = specificAiWritingSentence(result, "strength", submissionText);\n  const specificNextStep = specificAiWritingSentence(result, "next", submissionText);\n  const anchoredStrength = submissionAnchoredStrength(submissionText);\n  const anchoredNextStep = submissionAnchoredNextStep(submissionText);\n  const specificAnchoredStrength = anchoredStrength && !/^Your sentence “/i.test(anchoredStrength) ? anchoredStrength : "";\n  const optionalSentences = [\n    priorityStrength,\n    priorityTask,\n    structuredNextStep,\n    specificStrength,\n    specificNextStep,\n    specificAnchoredStrength,\n    anchoredNextStep,\n    ...writingDepthSentences(result, submissionText, level),\n    anchoredStrength,\n    strengthOf(result, submissionText, level, seed, history),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];\n  const hasPriorityWritingEvidence = Boolean(\n    priorityStrength\n    || priorityTask\n    || structuredNextStep\n    || specificStrength\n    || specificNextStep\n    || specificAnchoredStrength\n    || anchoredNextStep,\n  );\n  const feedbackMaximum = hasPriorityWritingEvidence\n    ? level === "B1" ? 75 : 60\n    : level === "B1" ? 120 : level === "A2" ? 100 : 60;`;
          if (!source.includes(newBlock)) {
            if (!source.includes(oldBlock)) throw new Error('priority feedback block anchor changed');
            source = source.replace(oldBlock, newBlock);
          }
          source = source.replace(
            `  }, level === "B1" ? 120 : level === "A2" ? 100 : 60);`,
            `  }, feedbackMaximum);`,
          );
          fs.writeFileSync(path, source);

          const testPath = 'tests/essay-feedback-evidence.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = tests.replace('assert.ok(feedback.split(/\\s+/).length <= 100);', 'assert.ok(feedback.split(/\\s+/).length <= 60);');
          tests = tests.replace('assert.ok(feedback.split(/\\s+/).length <= 120);', 'assert.ok(feedback.split(/\\s+/).length <= 75);');
          fs.writeFileSync(testPath, tests);
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet -- src/utils/essayFeedbackEvidence.js tests/essay-feedback-evidence.test.js; then
            echo 'Already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/essayFeedbackEvidence.js tests/essay-feedback-evidence.test.js
          git commit -m 'Reserve fallback depth for missing writing evidence'
          git push origin HEAD:fix/structured-feedback-priority
