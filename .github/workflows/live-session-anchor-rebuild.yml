name: Live session anchor rebuild

on:
  pull_request:
    paths:
      - 'src/utils/liveClassFollowingScheduleRestore.js'
      - 'src/utils/liveClassLessonOrder.js'
      - 'src/utils/liveClassSessionOwnership.js'
      - 'src/services/liveClassFollowingScheduleRestoreService.js'
      - 'src/services/liveClassLessonDateRepairService.js'
      - 'src/services/liveClassCompatibilityServiceBase.js'
      - 'src/components/LiveClassLessonDateRepair.jsx'
      - 'src/pages/CanonicalAttendancePageV3.jsx'
      - 'tests/live-class-following-schedule-restore.test.js'
      - 'tests/live-class-anchor-options-scope.test.js'
      - 'tests/live-class-compatible-session-scope.test.js'
      - 'tests/canonical-attendance-requested-session.test.js'
      - 'scripts/patchFollowingRestoreAnchorCollisions.mjs'
      - 'scripts/patchCanonicalAttendanceRequestedSession.mjs'
      - '.github/workflows/live-session-anchor-rebuild.yml'
  push:
    branches:
      - main
    paths:
      - 'src/utils/liveClassFollowingScheduleRestore.js'
      - 'src/utils/liveClassLessonOrder.js'
      - 'src/utils/liveClassSessionOwnership.js'
      - 'src/services/liveClassFollowingScheduleRestoreService.js'
      - 'src/services/liveClassLessonDateRepairService.js'
      - 'src/services/liveClassCompatibilityServiceBase.js'
      - 'src/components/LiveClassLessonDateRepair.jsx'
      - 'src/pages/CanonicalAttendancePageV3.jsx'
      - 'tests/live-class-following-schedule-restore.test.js'
      - 'tests/live-class-anchor-options-scope.test.js'
      - 'tests/live-class-compatible-session-scope.test.js'
      - 'tests/canonical-attendance-requested-session.test.js'
      - 'scripts/patchFollowingRestoreAnchorCollisions.mjs'
      - 'scripts/patchCanonicalAttendanceRequestedSession.mjs'
      - '.github/workflows/live-session-anchor-rebuild.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check committed source
        run: |
          node --check src/utils/liveClassFollowingScheduleRestore.js
          node --check src/utils/liveClassLessonOrder.js
          node --check src/utils/liveClassSessionOwnership.js
          node --check src/services/liveClassFollowingScheduleRestoreService.js
          node --check src/services/liveClassLessonDateRepairService.js
          node --check src/services/liveClassCompatibilityServiceBase.js
          node --check scripts/patchCanonicalAttendanceRequestedSession.mjs
      - name: Run anchor rebuild regressions
        run: node --test tests/live-class-following-schedule-restore.test.js tests/live-class-anchor-options-scope.test.js tests/live-class-compatible-session-scope.test.js tests/canonical-attendance-requested-session.test.js
      - name: Verify build-time compatibility
        run: npm run build
      - name: Re-run anchor regressions after prebuild patches
        run: node --test tests/live-class-following-schedule-restore.test.js tests/live-class-anchor-options-scope.test.js tests/live-class-compatible-session-scope.test.js tests/canonical-attendance-requested-session.test.js
