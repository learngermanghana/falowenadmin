name: Temp Fix B2 C1 Live Class

on:
  push:
    branches:
      - agent/fix-b2-dictionary-c1-chapter
    paths:
      - .github/workflows/temp-fix-b2-c1-liveclass.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-b2-dictionary-c1-chapter
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch B2 dictionary and C1 chapter parsing
        run: |
          node <<'NODE'
          const fs = require('fs');

          const dictPath = 'src/data/courseDictionary.js';
          let dict = fs.readFileSync(dictPath, 'utf8');
          const b2Source = fs.readFileSync('src/data/b2PresenterSlides.js', 'utf8');

          if (!/\n  B2:\s*\{/.test(dict)) {
            const lessons = [...b2Source.matchAll(/\{ day:\s*(\d+),\s*topic:\s*"([^"]+)"/g)]
              .map((match) => ({ day: Number(match[1]), topic: match[2] }))
              .filter((lesson, index, all) => all.findIndex((item) => item.day === lesson.day) === index)
              .sort((a, b) => a.day - b.day);
            if (lessons.length !== 28) throw new Error(`Expected 28 B2 lessons, found ${lessons.length}`);
            const rows = lessons.map(({ day, topic }) => {
              const id = `B2-${Math.ceil(day / 4)}.${day}`;
              const chapter = `${Math.ceil(day / 4)}.${day}`;
              return `    ${JSON.stringify(id)}: { assignment_id: ${JSON.stringify(id)}, chapter: ${JSON.stringify(chapter)}, de: ${JSON.stringify(topic)}, en: ${JSON.stringify(topic)} },`;
            }).join('\n');
            const marker = '\n  C1: {';
            if (!dict.includes(marker)) throw new Error('C1 dictionary marker not found');
            dict = dict.replace(marker, `\n  B2: {\n${rows}\n  },${marker}`);
          }

          if (!dict.includes('function getAssignmentLevel(value)')) {
            const marker = 'export function getCourseDictionaryEntry(assignmentId) {';
            if (!dict.includes(marker)) throw new Error('Dictionary lookup marker not found');
            dict = dict.replace(marker, `function getAssignmentLevel(value) {\n  const normalized = String(value || "").trim().toUpperCase();\n  return normalized.match(/^([A-Z]\\d)(?:[-\\s]|$)/)?.[1] || "";\n}\n\n${marker}`);
          }
          dict = dict.replace('const level = normalizedId.split("-")[0]?.toUpperCase();', 'const level = getAssignmentLevel(normalizedId);');
          dict = dict.replace('const level = String(assignmentId || "").split("-")[0]?.toUpperCase();', 'const level = getAssignmentLevel(assignmentId);');
          dict = dict.replace('const DAY_NUMBERED_LEVELS = new Set(["A1", "A2", "B1"]);', 'const DAY_NUMBERED_LEVELS = new Set(["A1", "A2", "B1", "B2", "C1"]);');
          fs.writeFileSync(dictPath, dict);

          const srcHelper = `export function parseAssignmentChapter(assignmentId) {\n  const normalized = String(assignmentId || "").trim();\n  const match = normalized.match(/^[A-Z]\\d(?:-|\\s+)(.+)$/i);\n  return match ? String(match[1] || "").trim() : "";\n}\n`;
          fs.writeFileSync('src/utils/assignmentChapter.js', srcHelper);

          for (const pagePath of ['src/pages/CanonicalAttendancePageV2.jsx', 'src/pages/CanonicalAttendancePageV3.jsx']) {
            let source = fs.readFileSync(pagePath, 'utf8');
            if (!source.includes('assignmentChapter.js')) {
              source = `import { parseAssignmentChapter } from "../utils/assignmentChapter.js";\n${source}`;
            }
            source = source.replace('assignmentId.split("-").slice(1).join("-")', 'parseAssignmentChapter(assignmentId)');
            fs.writeFileSync(pagePath, source);
          }

          const functionHelper = `function parseAssignmentChapter(assignmentId) {\n  const normalized = String(assignmentId || "").trim();\n  const match = normalized.match(/^[A-Z]\\d(?:-|\\s+)(.+)$/i);\n  return match ? String(match[1] || "").trim() : "";\n}\n\nmodule.exports = { parseAssignmentChapter };\n`;
          fs.writeFileSync('functions/assignmentChapter.js', functionHelper);

          const localParserRegex = /function parseAssignmentChapter\(assignmentId\) \{\n  const normalized = String\(assignmentId \|\| ""\)\.trim\(\);\n  const parts = normalized\.split\("-"\);\n  return parts\.length > 1 \? String\(parts\.slice\(1\)\.join\("-"\)\)\.trim\(\) : "";\n\}\n\n/;
          let functionsIndex = fs.readFileSync('functions/index.js', 'utf8');
          if (!functionsIndex.includes('./assignmentChapter.js')) {
            functionsIndex = functionsIndex.replace('const crypto = require("crypto");', 'const crypto = require("crypto");\nconst { parseAssignmentChapter } = require("./assignmentChapter.js");');
          }
          functionsIndex = functionsIndex.replace(localParserRegex, '');
          fs.writeFileSync('functions/index.js', functionsIndex);

          const autoParserRegex = /function parseAssignmentChapter\(assignmentId\) \{\n  const normalized = text\(assignmentId\);\n  const parts = normalized\.split\("-"\);\n  return parts\.length > 1 \? text\(parts\.slice\(1\)\.join\("-"\)\) : "";\n\}\n\n/;
          let autoOpen = fs.readFileSync('functions/classSessionAutoCheckin.js', 'utf8');
          if (!autoOpen.includes('./assignmentChapter.js')) {
            autoOpen = `const { parseAssignmentChapter } = require("./assignmentChapter.js");\n${autoOpen}`;
          }
          autoOpen = autoOpen.replace(autoParserRegex, '');
          fs.writeFileSync('functions/classSessionAutoCheckin.js', autoOpen);

          const testSource = `import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\nimport { createRequire } from "node:module";\nimport { courseDictionary, getCourseDictionaryEntry, getUnifiedTopicLabel } from "../src/data/courseDictionary.js";\nimport { getCourseSessionGroups } from "../src/data/courseSessionGroups.js";\nimport { parseAssignmentChapter as parseBrowserChapter } from "../src/utils/assignmentChapter.js";\n\nconst require = createRequire(import.meta.url);\nconst { parseAssignmentChapter: parseFunctionChapter } = require("../functions/assignmentChapter.js");\n\ntest("B2 is registered in the live-class course dictionary", () => {\n  const entries = Object.values(courseDictionary.B2 || {});\n  assert.equal(entries.length, 28);\n  assert.equal(entries[0].assignment_id, "B2-1.1");\n  assert.ok(entries.some((entry) => entry.assignment_id === "B2-7.28"));\n  const groups = getCourseSessionGroups("B2");\n  assert.equal(groups.length, 28);\n  assert.equal(groups[0].assignmentIds[0], "B2-1.1");\n  assert.equal(groups[27].assignmentIds[0], "B2-7.28");\n});\n\ntest("C1 space-delimited assignment IDs resolve through the dictionary", () => {\n  assert.equal(getCourseDictionaryEntry("C1 1")?.chapter, "1");\n  assert.equal(getCourseDictionaryEntry("c1 28")?.chapter, "28");\n  assert.match(getUnifiedTopicLabel("C1 1"), /^1\\./);\n});\n\ntest("browser and Firebase chapter parsers support hyphen and C1 space formats", () => {\n  for (const parser of [parseBrowserChapter, parseFunctionChapter]) {\n    assert.equal(parser("B2-7.28"), "7.28");\n    assert.equal(parser("C1 28"), "28");\n    assert.equal(parser("A1-Tutorial"), "Tutorial");\n    assert.equal(parser(""), "");\n  }\n});\n\ntest("attendance entry points use the shared chapter parsers", () => {\n  for (const path of ["src/pages/CanonicalAttendancePageV2.jsx", "src/pages/CanonicalAttendancePageV3.jsx"]) {\n    const source = fs.readFileSync(path, "utf8");\n    assert.match(source, /parseAssignmentChapter\\(assignmentId\\)/);\n    assert.doesNotMatch(source, /assignmentId\\.split\\("-"\\)/);\n  }\n  const functionsIndex = fs.readFileSync("functions/index.js", "utf8");\n  const autoOpen = fs.readFileSync("functions/classSessionAutoCheckin.js", "utf8");\n  assert.match(functionsIndex, /require\\("\\.\\/assignmentChapter\\.js"\\)/);\n  assert.match(autoOpen, /require\\("\\.\\/assignmentChapter\\.js"\\)/);\n});\n`;
          fs.writeFileSync('tests/b2-c1-liveclass-regressions.test.js', testSource);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run B2/C1 hotfix and related live-class tests
        run: node --test tests/b2-c1-liveclass-regressions.test.js tests/course-session-groups.test.js tests/live-class-session-picker.test.js tests/c1-presenter-v2-all-days.test.js tests/b2-presenter-v2-all-days.test.js tests/teaching-presenter.test.js

      - name: Build Falowen Admin
        run: npm run build

      - name: Commit hotfix
        run: |
          git config user.name "learngermanghana"
          git config user.email "learngermanghana@gmail.com"
          git add src/data/courseDictionary.js src/data/courseSessionGroups.js src/utils/assignmentChapter.js src/pages/CanonicalAttendancePageV2.jsx src/pages/CanonicalAttendancePageV3.jsx functions/assignmentChapter.js functions/index.js functions/classSessionAutoCheckin.js tests/b2-c1-liveclass-regressions.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix B2 live-class dictionary and C1 chapter parsing"
          git push origin HEAD:agent/fix-b2-dictionary-c1-chapter
