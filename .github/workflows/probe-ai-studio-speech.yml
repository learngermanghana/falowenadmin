name: Probe Google Studio speech
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Test one short non-student speech request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/probeStudioSpeech.mjs
