name: Chat model migration
on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/chat-model-migration.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/chat-model-migration.yml"
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test functions/chatModelConfig.test.cjs
