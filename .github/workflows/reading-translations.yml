name: A2 and B1 saved reading translations
on:
  pull_request:
    paths:
      - 'src/components/TeachingSlidePresenter.*'
      - 'src/components/PresenterReadingTranslation.jsx'
      - 'src/hooks/useReadingTranslation.js'
      - 'src/utils/presenterReadingTranslation.js'
      - 'src/utils/presenterSentenceNumbering.js'
      - 'src/utils/teachingPresenter.js'
      - 'src/data/presenterReading*.js'
      - 'tests/presenter-reading-translation*.js'
      - '.github/workflows/reading-translations.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/TeachingSlidePresenter.*'
      - 'src/components/PresenterReadingTranslation.jsx'
      - 'src/hooks/useReadingTranslation.js'
      - 'src/utils/presenterReadingTranslation.js'
      - 'src/utils/presenterSentenceNumbering.js'
      - 'src/utils/teachingPresenter.js'
      - 'src/data/presenterReading*.js'
      - 'tests/presenter-reading-translation*.js'
jobs:
  reading-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/presenter-reading-translations.test.js tests/presenter-reading-translation-ui.test.js tests/presenter-sentence-numbering.test.js tests/a2-b1-reading-common-mistakes.test.js
