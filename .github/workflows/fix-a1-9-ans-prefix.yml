name: Fix A1-9 Ans prefix

on:
  push:
    branches:
      - improve/marking-foundation
    paths:
      - '.github/workflows/fix-a1-9-ans-prefix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/marking-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accept Ans-prefixed objective choices
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/utils/objectiveMarking.js')
          source = path.read_text()
          before = '''function extractOptionLetter(value = "") {
  const raw = stripAnswerQuestionLabel(value);
  const anzeige = raw.match(new RegExp(`\\banzeige\\s*([${OPTION_LETTERS}])\\b`, "i"));
  if (anzeige) return anzeige[1].toUpperCase();
  const explicit = raw.match(new RegExp(`^([${OPTION_LETTERS}])(?:\\s*[().:/-]|\\s+|$)`, "i"));
  return explicit ? explicit[1].toUpperCase() : "";
}'''
          after = '''function extractOptionLetter(value = "") {
  const raw = stripAnswerQuestionLabel(value);
  const anzeige = raw.match(new RegExp(`\\banzeige\\s*([${OPTION_LETTERS}])\\b`, "i"));
  if (anzeige) return anzeige[1].toUpperCase();
  const prefixed = raw.match(new RegExp(`^(?:ans(?:wer)?|antwort)\\s*[:.)/-]?\\s*([${OPTION_LETTERS}])(?:\\s*[().:/-]|\\s+|$)`, "i"));
  if (prefixed) return prefixed[1].toUpperCase();
  const explicit = raw.match(new RegExp(`^([${OPTION_LETTERS}])(?:\\s*[().:/-]|\\s+|$)`, "i"));
  return explicit ? explicit[1].toUpperCase() : "";
}'''
          if after not in source:
              if before not in source:
                  raise SystemExit('extractOptionLetter anchor not found')
              path.write_text(source.replace(before, after, 1))
          PY
      - name: Validate reported A1-9 submission
        run: |
          node --check src/utils/objectiveMarking.js
          node --test tests/a1-9-ans-prefix.test.js
      - name: Commit parser fix
        run: |
          if git diff --quiet -- src/utils/objectiveMarking.js; then
            echo "No parser change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js
          git commit -m "Accept Ans-prefixed objective choices"
          git push origin HEAD:improve/marking-foundation
