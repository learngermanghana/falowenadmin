name: Teaching slides tests

on:
  pull_request:
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/data/a2WorkbookAlignedSlides.js"
      - "src/data/a2WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a2WorkbookAlignedSlidesDays11To15.js"
      - "src/data/a2WorkbookAlignedSlidesDays16To20.js"
      - "src/data/a2WorkbookAlignedSlidesDays21To24.js"
      - "src/data/a2WorkbookAlignedSlidesDays25To28.js"
      - "src/data/b1WorkbookAlignedSlidesDays1To10.js"
      - "src/data/teachingSlides.js"
      - "src/data/teacherLessonGuidance.js"
      - "src/data/teacherSlideSupport.js"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "tests/a2-workbook-aligned-slides.test.js"
      - "tests/a2-workbook-aligned-slides-days6-10.test.js"
      - "tests/a2-workbook-aligned-slides-days11-15.test.js"
      - "tests/a2-workbook-aligned-slides-days16-20.test.js"
      - "tests/a2-workbook-aligned-slides-days21-24.test.js"
      - "tests/a2-workbook-aligned-slides-days25-28.test.js"
      - "tests/b1-workbook-aligned-slides-days1-10.test.js"
      - "tests/teaching-presenter.test.js"
      - "tests/teacher-lesson-guidance.test.js"
      - "tests/teacher-slide-support.test.js"
      - ".github/workflows/teaching-presenter-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/data/a2WorkbookAlignedSlides.js"
      - "src/data/a2WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a2WorkbookAlignedSlidesDays11To15.js"
      - "src/data/a2WorkbookAlignedSlidesDays16To20.js"
      - "src/data/a2WorkbookAlignedSlidesDays21To24.js"
      - "src/data/a2WorkbookAlignedSlidesDays25To28.js"
      - "src/data/b1WorkbookAlignedSlidesDays1To10.js"
      - "src/data/teachingSlides.js"
      - "src/data/teacherLessonGuidance.js"
      - "src/data/teacherSlideSupport.js"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "tests/a2-workbook-aligned-slides.test.js"
      - "tests/a2-workbook-aligned-slides-days6-10.test.js"
      - "tests/a2-workbook-aligned-slides-days11-15.test.js"
      - "tests/a2-workbook-aligned-slides-days16-20.test.js"
      - "tests/a2-workbook-aligned-slides-days21-24.test.js"
      - "tests/a2-workbook-aligned-slides-days25-28.test.js"
      - "tests/b1-workbook-aligned-slides-days1-10.test.js"
      - "tests/teaching-presenter.test.js"
      - "tests/teacher-lesson-guidance.test.js"
      - "tests/teacher-slide-support.test.js"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run teaching slide regression tests
        run: node --test tests/teaching-presenter.test.js tests/teacher-slide-support.test.js tests/a2-workbook-aligned-slides.test.js tests/a2-workbook-aligned-slides-days6-10.test.js tests/a2-workbook-aligned-slides-days11-15.test.js tests/a2-workbook-aligned-slides-days16-20.test.js tests/a2-workbook-aligned-slides-days21-24.test.js tests/a2-workbook-aligned-slides-days25-28.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/teacher-lesson-guidance.test.js
      - name: Build production bundle
        run: npm run build
