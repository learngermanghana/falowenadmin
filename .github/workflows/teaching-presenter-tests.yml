name: Teaching slides tests

on:
  pull_request:
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/StudentCourseSlides.jsx"
      - "src/components/StudentCourseSlides.css"
      - "src/data/**"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "src/utils/presenterSentenceNumbering.js"
      - "src/utils/studentSlidePractice.js"
      - "src/utils/autoMarking.js"
      - "scripts/auditA2B1SpeakingCoaching.mjs"
      - "scripts/patchB2C1SpeakingModels.mjs"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "scripts/data/b2c1-speaking-models-*.txt"
      - "tests/**"
      - "package.json"
      - ".github/workflows/teaching-presenter-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/StudentCourseSlides.jsx"
      - "src/components/StudentCourseSlides.css"
      - "src/data/**"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "src/utils/presenterSentenceNumbering.js"
      - "src/utils/studentSlidePractice.js"
      - "src/utils/autoMarking.js"
      - "scripts/patchB2C1SpeakingModels.mjs"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "scripts/data/b2c1-speaking-models-*.txt"
      - "tests/**"
      - "package.json"
      - ".github/workflows/teaching-presenter-tests.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply B2/C1 speaking-model patch
        run: node scripts/patchB2C1SpeakingModels.mjs
      - name: Apply objective parser patch
        run: node scripts/patchNumberedTextObjectiveSections.mjs
      - name: Test A1 objective parser
        run: node --test tests/a1-02-unnumbered-trailing-objective-text.test.js
      - name: Verify B1 Day 18 replacement and B1 presenter practice spine
        run: node --test tests/b1-day18-teacher-career-challenge.test.js tests/b1-presenter-v2-all-days.test.js tests/b1-six-teacher-challenges.test.js tests/a2-b1-reflective-wrapup.test.js
      - name: Verify twelve A2 scenario challenge replacements
        run: node --test tests/a2-twelve-teacher-challenges.test.js
      - name: Verify A2 warm-up followups and Wortschatz questions
        run: node --test tests/a2-curated-warmup-and-vocabulary.test.js tests/a2-b1-warmup-support.test.js
      - name: Verify B1 curated follow-ups and Wortschatz questions
        run: node --test tests/b1-curated-warmup-and-vocabulary.test.js tests/a2-b1-warmup-support.test.js
      - name: Verify A2/B1 contextual grammar answers and lesson summaries
        run: node --test tests/a2-b1-specific-grammar-and-summary.test.js tests/presenter-grammar-diagnostic-and-teacher-purpose.test.js
      - name: Verify A2 and B1 curated Wissensimpuls answer bank
        run: node --test tests/a2-b1-curated-knowledge-answers.test.js tests/a2-twelve-teacher-challenges.test.js tests/b1-six-teacher-challenges.test.js
      - name: Verify A2/B1 speaking hints and teacher feedback
        run: node --test tests/a2-b1-speaking-coaching.test.js tests/a2-b1-teaching-audit.test.js
      - name: Verify C2 question-grounded seminar coaching and warm-up support
        run: node --test tests/c2-speaking-coaching.test.js tests/c2-presenter-v2-all-days.test.js
      - name: Audit each A2/B1 lesson for grounded speaking support
        run: node scripts/auditA2B1SpeakingCoaching.mjs
      - name: Run teaching slide regression tests
        run: node --test tests/presenter-sentence-numbering.test.js tests/warmup-adaptive-controls.test.js tests/teaching-presenter.test.js tests/teacher-slide-support.test.js tests/a1-workbook-aligned-slides-days1-5.test.js tests/a1-workbook-aligned-slides-days6-10.test.js tests/a2-b1-warmup-support.test.js tests/a2-workbook-aligned-slides.test.js tests/a2-workbook-aligned-slides-days6-10.test.js tests/a2-workbook-aligned-slides-days11-15.test.js tests/a2-workbook-aligned-slides-days16-20.test.js tests/a2-workbook-aligned-slides-days21-24.test.js tests/a2-workbook-aligned-slides-days25-28.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/b1-workbook-aligned-slides-days11-20.test.js tests/b1-workbook-aligned-slides-days21-28.test.js tests/c2-presenter-v2-all-days.test.js tests/teacher-lesson-guidance.test.js tests/*speaking-model-answers.test.js
      - name: Build production bundle
        run: npm run build
