name: Live Class Mutation Consistency

on:
  pull_request:
    paths:
      - 'src/utils/liveClassMutationSessions.js'
      - 'src/utils/liveClassSessionDedupe.js'
      - 'src/utils/liveClassReschedulePlan.js'
      - 'src/utils/liveClassLessonOrder.js'
      - 'src/data/courseSessionGroups.js'
      - 'tests/live-class-mutation-sessions.test.js'
      - '.github/workflows/live-class-mutation-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/utils/liveClassMutationSessions.js'
      - 'src/utils/liveClassSessionDedupe.js'
      - 'src/utils/liveClassReschedulePlan.js'
      - 'src/utils/liveClassLessonOrder.js'
      - 'src/data/courseSessionGroups.js'
      - 'tests/live-class-mutation-sessions.test.js'
      - '.github/workflows/live-class-mutation-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify mutation timetable uses canonical curriculum identity
        run: node --test tests/live-class-mutation-sessions.test.js
