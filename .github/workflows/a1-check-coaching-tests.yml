name: A1 lesson-specific coaching

on:
  pull_request:
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/TeachingSlidePresenter.css"
      - "src/data/a1CheckCoaching.js"
      - "src/data/a1LearningPath.js"
      - "src/data/a1SlideReview.js"
      - "src/data/a1Days1To5Understanding.js"
      - "src/data/a1Days6To10Understanding.js"
      - "src/data/a1Days11To15Understanding.js"
      - "src/data/a1Days16To20Understanding.js"
      - "src/data/a1Days16To20Slides.js"
      - "src/data/a1Days11To15Slides.js"
      - "src/data/a1GenericLessonUpgrades.js"
      - "src/data/a1PublishedWorkbookRoutes.js"
      - "src/data/a1WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a1GrammarChecks.js"
      - "scripts/patchA1Day2ContactChallenge.mjs"
      - "tests/a1-presenter-topic-integrity.test.js"
      - "tests/a1-slide-quality-audit.test.js"
      - "src/data/a1PresenterUnderstandingChecks.js"
      - "src/data/a1GrammarChecks.js"
      - "src/data/a1TopicTeacherSupport.js"
      - "src/data/teachingSlides.js"
      - "scripts/auditA1CheckCoaching.mjs"
      - "tests/a1-check-coaching.test.js"
      - "tests/a1-learning-path.test.js"
      - "tests/a1-slide-review.test.js"
      - "tests/a1-days1-to5-understanding.test.js"
      - "tests/a1-days6-to10-understanding.test.js"
      - "tests/a1-days11-to15-understanding.test.js"
      - "tests/a1-days16-to20-understanding.test.js"
      - "tests/a1-presenter-class-understanding.test.js"
      - "scripts/auditA1Days16To20Slides.mjs"
      - "scripts/auditA1Days11To15Slides.mjs"
      - "tests/a1-workbook-aligned-slides-days6-10.test.js"
      - "scripts/auditA1Days6To10Slides.mjs"
      - "scripts/auditA1Days1To5Slides.mjs"
      - ".github/workflows/a1-check-coaching-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/TeachingSlidePresenter.css"
      - "src/data/a1CheckCoaching.js"
      - "src/data/a1LearningPath.js"
      - "src/data/a1SlideReview.js"
      - "src/data/a1Days1To5Understanding.js"
      - "src/data/a1Days6To10Understanding.js"
      - "src/data/a1Days11To15Understanding.js"
      - "src/data/a1Days16To20Understanding.js"
      - "src/data/a1Days16To20Slides.js"
      - "src/data/a1Days11To15Slides.js"
      - "src/data/a1GenericLessonUpgrades.js"
      - "src/data/a1PublishedWorkbookRoutes.js"
      - "src/data/a1WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a1GrammarChecks.js"
      - "scripts/patchA1Day2ContactChallenge.mjs"
      - "tests/a1-presenter-topic-integrity.test.js"
      - "tests/a1-slide-quality-audit.test.js"
      - "src/data/a1PresenterUnderstandingChecks.js"
      - "src/data/a1GrammarChecks.js"
      - "src/data/a1TopicTeacherSupport.js"
      - "src/data/teachingSlides.js"
      - "scripts/auditA1CheckCoaching.mjs"
      - "tests/a1-check-coaching.test.js"
      - "tests/a1-learning-path.test.js"
      - "tests/a1-slide-review.test.js"
      - "tests/a1-days1-to5-understanding.test.js"
      - "tests/a1-days6-to10-understanding.test.js"
      - "tests/a1-days11-to15-understanding.test.js"
      - "tests/a1-days16-to20-understanding.test.js"
      - "tests/a1-presenter-class-understanding.test.js"
      - "scripts/auditA1Days16To20Slides.mjs"
      - "scripts/auditA1Days11To15Slides.mjs"
      - "tests/a1-workbook-aligned-slides-days6-10.test.js"
      - "scripts/auditA1Days6To10Slides.mjs"
      - "tests/a1-workbook-aligned-slides-days1-5.test.js"
      - "scripts/auditA1Days1To5Slides.mjs"
      - ".github/workflows/a1-check-coaching-tests.yml"
  workflow_dispatch:

jobs:
  a1-lesson-coaching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply normal build-time source synchronisation
        run: npm run sync:build
      - name: Test A1 scaffolds and existing grammar-diagnostic contract
        run: node --test tests/a1-check-coaching.test.js tests/a1-learning-path.test.js tests/a1-slide-review.test.js tests/a1-days1-to5-understanding.test.js tests/a1-grammar-diagnostic-presenter.test.js tests/a1-presenter-class-understanding.test.js tests/a1-presenter-topic-integrity.test.js tests/a1-slide-quality-audit.test.js tests/a1-lesson9-topic-clarity.test.js tests/a1-workbook-aligned-slides-days1-5.test.js tests/a1-days6-to10-understanding.test.js tests/a1-workbook-aligned-slides-days6-10.test.js tests/a1-days11-to15-understanding.test.js tests/a1-days16-to20-understanding.test.js
      - name: Audit each A1 lesson's question-specific guidance
        run: node scripts/auditA1CheckCoaching.mjs
      - name: Audit every A1 Day 1–5 lesson, answer and assignment route
        run: node scripts/auditA1Days1To5Slides.mjs
      - name: Audit every A1 Day 6–10 lesson, answer and assignment route
        run: node scripts/auditA1Days6To10Slides.mjs
      - name: Audit every A1 Day 11–15 lesson, answer and learner route
        run: node scripts/auditA1Days11To15Slides.mjs
      - name: Audit every A1 Day 16–20 lesson, answer and Course Book route
        run: node scripts/auditA1Days16To20Slides.mjs
      - name: Compile Admin frontend
        run: npx vite build
