name: Mock monitoring regressions

on:
  pull_request:
    paths:
      - "src/pages/TimedAssignmentAttemptsPage.jsx"
      - "src/pages/StudentResultsComparePage.jsx"
      - "src/components/DraftHistoryPanel.jsx"
      - "functions/draftHistory.js"
      - "functions/draftHistory.test.cjs"
      - "src/components/TimedDraftRecoveryPanel.jsx"
      - "functions/timedDraftRecovery.js"
      - "functions/timedDraftRecovery.test.cjs functions/draftHistory.test.cjs"
      - "src/services/placementAttemptService.js"
      - "tests/placement-attempt-monitoring.test.js"
      - "src/utils/mockAttemptMonitoring.js"
      - "src/utils/timedAttemptLookup.js"
      - "src/utils/timedSubmissionReceiptLookup.js"
      - "tests/timed-submission-receipt-lookup.test.js"
      - "tests/timed-attempt-lookup.test.js"
      - "src/App.jsx"
      - "tests/mock-timed-monitoring.test.js"
      - "tests/student-leads-hub.test.js"
      - ".github/workflows/mock-monitoring-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/TimedAssignmentAttemptsPage.jsx"
      - "src/pages/StudentResultsComparePage.jsx"
      - "src/components/DraftHistoryPanel.jsx"
      - "functions/draftHistory.js"
      - "functions/draftHistory.test.cjs"
      - "src/components/TimedDraftRecoveryPanel.jsx"
      - "functions/timedDraftRecovery.js"
      - "functions/timedDraftRecovery.test.cjs"
      - "src/services/placementAttemptService.js"
      - "tests/placement-attempt-monitoring.test.js"
      - "src/utils/mockAttemptMonitoring.js"
      - "src/utils/timedAttemptLookup.js"
      - "src/utils/timedSubmissionReceiptLookup.js"
      - "tests/timed-submission-receipt-lookup.test.js"
      - "tests/timed-attempt-lookup.test.js"
      - "src/App.jsx"
      - "tests/mock-timed-monitoring.test.js"
      - "tests/student-leads-hub.test.js"
      - ".github/workflows/mock-monitoring-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/mock-timed-monitoring.test.js tests/student-leads-hub.test.js tests/placement-attempt-monitoring.test.js tests/timed-attempt-lookup.test.js tests/timed-submission-receipt-lookup.test.js functions/timedDraftRecovery.test.cjs
