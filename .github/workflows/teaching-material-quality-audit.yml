name: Teaching material quality audit

on:
  pull_request:
    paths:
      - "src/data/**"
      - "src/utils/teachingPresenter.js"
      - "src/components/A1GrammarPresenter.jsx"
      - "src/data/a2WorkbookAlignedSlides*.js"
      - "scripts/auditTeachingMaterialQuality.mjs"
      - ".github/workflows/teaching-material-quality-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/data/**"
      - "src/utils/teachingPresenter.js"
      - "src/components/A1GrammarPresenter.jsx"
      - "scripts/auditTeachingMaterialQuality.mjs"
      - ".github/workflows/teaching-material-quality-audit.yml"
  workflow_dispatch:

jobs:
  a1-a2-teacher-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare production teaching slides
        run: |
          node scripts/patchB2C1SpeakingModels.mjs
          node scripts/patchA2OneMinuteKnowledge.mjs
          node scripts/patchA2Day19ActionableRestore.mjs

      - name: Stage 1 · Audit A1 teacher materials
        run: node scripts/auditTeachingMaterialQuality.mjs --level=A1

      - name: Stage 2 · Audit A2 teacher materials
        if: always()
        run: node scripts/auditTeachingMaterialQuality.mjs --level=A2
