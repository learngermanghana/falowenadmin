name: A1-B1 writing structure marking

on:
  pull_request:
    paths:
      - "functions/index.js"
      - "src/utils/writingStructureReview.js"
      - "src/utils/questionAwareWritingMarking.js"
      - "src/pages/MarkingPage.jsx"
      - "src/pages/MarkingPage.css"
      - "tests/writing-structure-marking.test.js"
      - ".github/workflows/a1-b1-writing-structure-marking.yml"
  push:
    branches: [main]
    paths:
      - "functions/index.js"
      - "src/utils/writingStructureReview.js"
      - "src/utils/questionAwareWritingMarking.js"
      - "src/pages/MarkingPage.jsx"
      - "tests/writing-structure-marking.test.js"
      - ".github/workflows/a1-b1-writing-structure-marking.yml"

jobs:
  verify-writing-marking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check backend examiner prompt syntax
        run: node --check functions/index.js
      - name: Writing structure and existing semantic marking regressions
        run: >
          node --test
          tests/writing-structure-marking.test.js
          tests/a1-question-aware-writing-marking.test.js
          tests/question-aware-writing-marking.test.js
          tests/b1-semantic-writing-marking.test.js
          tests/writing-rubric.test.js
      - name: Compile Admin UI without running deployment
        run: npx vite build
