name: Organisation enrolment
on:
  pull_request:
    paths:
      - 'functions/organisationEnrolment*'
      - 'functions/organisationPayments*'
      - 'functions/partnership*'
      - 'functions/referralPayouts*'
      - 'functions/main.js'
      - 'functions/package*'
      - 'functions/assets/*'
      - 'src/components/SignedPartnershipForm.jsx'
      - 'src/pages/PaystackPage.jsx'
      - 'scripts/patchStudentPaymentLinks.mjs'
      - 'functions/referralProgramme*'
      - 'src/pages/PartnershipPage*'
      - 'src/pages/ReferralReviewPage.jsx'
      - 'tests/referral-pages.test.js'
      - 'functions/index.js'
      - 'src/pages/OrganisationEnrolment*'
      - 'src/pages/StudentDirectoryPage.jsx'
      - 'src/pages/StudentHubPage.jsx'
      - 'src/App.jsx'
      - 'api/router.js'
      - 'src/utils/organisationEnrolmentRequest.js'
      - 'tests/organisation-enrolment-request.test.js'
      - '.github/workflows/organisation-enrolment.yml'
  push:
    branches: [main]
    paths:
      - 'functions/organisationEnrolment*'
      - 'functions/organisationPayments*'
      - 'functions/partnership*'
      - 'functions/referralPayouts*'
      - 'functions/main.js'
      - 'functions/package*'
      - 'functions/assets/*'
      - 'src/components/SignedPartnershipForm.jsx'
      - 'src/pages/PaystackPage.jsx'
      - 'scripts/patchStudentPaymentLinks.mjs'
      - 'functions/referralProgramme*'
      - 'src/pages/PartnershipPage*'
      - 'src/pages/ReferralReviewPage.jsx'
      - 'tests/referral-pages.test.js'
      - 'src/pages/OrganisationEnrolment*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions --ignore-scripts
      - run: node --test functions/partnershipAgreements.test.cjs functions/referralPayouts.test.cjs functions/organisationPayments.test.cjs tests/referral-pages.test.js functions/referralProgramme.test.cjs tests/organisation-enrolment-request.test.js functions/organisationEnrolment.test.cjs functions/studentAccountActivation.test.cjs tests/student-emergency-contact.test.js
      - run: npm run build
