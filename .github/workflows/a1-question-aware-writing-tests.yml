name: A1 Question-Aware Writing Tests

on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'src/data/a1WritingTaskSpecs.js'
      - 'src/data/answers_dictionary.json'
      - 'src/utils/a1WritingTaskEvidence.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchObjectiveOnlyNaturalFeedback.mjs'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'tests/a1-question-aware-writing-marking.test.js'
      - 'tests/objective-only-natural-feedback.test.js'
      - '.github/workflows/a1-question-aware-writing-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/index.js'
      - 'src/data/a1WritingTaskSpecs.js'
      - 'src/data/answers_dictionary.json'
      - 'src/utils/a1WritingTaskEvidence.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchObjectiveOnlyNaturalFeedback.mjs'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'tests/a1-question-aware-writing-marking.test.js'
      - 'tests/objective-only-natural-feedback.test.js'
      - '.github/workflows/a1-question-aware-writing-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate A1 question-aware source
        run: |
          node --check functions/index.js
          node --check src/data/a1WritingTaskSpecs.js
          node --check src/utils/a1WritingTaskEvidence.js
          node --check src/utils/questionAwareWritingMarking.js
      - name: Run A1 question-aware writing regressions
        run: node --test tests/a1-question-aware-writing-marking.test.js
      - name: Apply objective-only feedback guard twice
        run: |
          node scripts/patchObjectiveOnlyNaturalFeedback.mjs
          node scripts/patchObjectiveOnlyNaturalFeedback.mjs
          node --check src/utils/naturalMarkingFeedback.js
          node --check src/utils/essayFeedbackEvidence.js
      - name: Block false A1 writing feedback
        run: node --test tests/objective-only-natural-feedback.test.js
      - name: Preserve A1-13 mixed marking
        run: node --test tests/a1-13-writing-marking.test.js
      - name: Preserve A1 family writing marking
        run: node --test tests/a1-price-preference-marking.test.js
      - name: Preserve A1-14.1 objective scoring
        run: node --test --test-name-pattern="computes A1-14\\.1 objective score from choices|computes A1-14\\.1 objective score from the Reuben|computes partial A1-14\\.1" tests/objective-marking.test.js
