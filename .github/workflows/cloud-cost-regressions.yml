name: Cloud cost regressions

on:
  pull_request:
    paths:
      - 'functions/trialAccessEmails.js'
      - 'functions/pendingStudentCleanup.js'
      - 'src/utils/visiblePolling.js'
      - 'src/components/StudentPaymentTools.jsx'
      - 'src/pages/MarkingPage.jsx'
      - 'src/pages/TimedAssignmentAttemptsPage.jsx'
      - 'tests/cloud-cost-polling.test.js'
      - 'tests/trial-access-emails.test.js'
      - '.github/workflows/cloud-cost-regressions.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloud-cost-polling.test.js tests/trial-access-emails.test.js tests/mock-timed-monitoring.test.js tests/student-payment-listener-stability.test.js
