name: Completion Participation Document Tests

on:
  pull_request:
    paths:
      - 'functions/completionParticipationDocument.js'
      - 'functions/index.js'
      - 'tests/completion-participation-document.test.js'
      - 'docs/completion-attendance-participation.md'
      - '.github/workflows/completion-participation-document-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/completionParticipationDocument.js'
      - 'functions/index.js'
      - 'tests/completion-participation-document.test.js'
      - 'docs/completion-attendance-participation.md'
      - '.github/workflows/completion-participation-document-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function dependencies
        working-directory: functions
        run: npm ci
      - name: Syntax check completion document service
        run: |
          node --check functions/completionParticipationDocument.js
          node --check functions/index.js
      - name: Run completion document regressions
        run: node --test tests/completion-participation-document.test.js
