name: Falowen Admin production release

on:
  pull_request:
    paths:
      - ".github/workflows/production-release.yml"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/teacher-lesson-dashboard-tests.yml"
      - "api/router.js"
      - "src/App.jsx"
      - "src/App.css"
      - "src/pages/TimedAssignmentAttemptsPage.jsx"
      - "tests/student-leads-hub.test.js"
      - "vite.config.js"
      - "vercel.json"
      - "tests/production-release-guard.test.js"
      - "src/data/a2B1LessonProfile.js"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "src/utils/markingReview.js"
      - "tests/a2-b1-lesson-profile.test.js"
      - "tests/production-deployment-contract.test.js"
      - "scripts/writeBuildIdentity.mjs"
      - "scripts/patchStudentProfileUpdateApi.mjs"
      - "scripts/applyMarkingManualSelectionFix.mjs"
      - "scripts/patchSmartMarkingNaturalFeedback.mjs"
      - "scripts/patchA2B1MarkingWeights.mjs"
      - "scripts/patchA2B1WritingScoreNormalization.mjs"
      - "scripts/patchA2B1PassMetadata.mjs"
      - "scripts/patchSharedWritingScoreRecovery.mjs"
      - "scripts/checkProductionIdentity.mjs"
      - "package.json"
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: falowen-admin-production-release
  cancel-in-progress: false

env:
  PRODUCTION_URL: "https://admin.falowen.app"
  VERCEL_PROJECT_ID: "prj_LPtknLn9PLUo0TXQEPPKAMGbMsvQ"
  VERCEL_ORG_ID: "team_vYAAqPf7zycxvsCSqqPFo5qc"

jobs:
  config-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source sync on clean checkout
        run: npm run sync:build
      - name: Verify student payment link is discoverable
        run: node --test tests/student-payment-links.test.js tests/student-payment-directory-access.test.js
      - name: Compile Admin UI after source sync
        run: npx vite build
      - name: Verify live marking contract, Day 10 writing and objective labels
        run: node --test tests/live-marking-contract-and-objective-label.test.js
      - name: Validate production release wiring
        run: node --test tests/production-release-guard.test.js tests/teacher-lesson-dashboard.test.js

  release-gate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare production source exactly once
        run: npm run sync:build
      - name: Run release-critical regressions
        run: >
          node --test
          tests/production-release-guard.test.js
          tests/student-leads-hub.test.js
          tests/student-payment-links.test.js
          tests/student-payment-directory-access.test.js
          tests/teacher-lesson-dashboard.test.js
          tests/student-admin-curriculum-parity.test.js
          tests/presenter-timers.test.js
          tests/teaching-presenter.test.js
          tests/a2-b1-lesson-profile.test.js
          tests/production-deployment-contract.test.js
          tests/live-marking-contract-and-objective-label.test.js
      - name: Check learner-source parity
        run: node scripts/auditStudentAdminCurriculumParity.mjs
      - name: Run production contract gate
        run: npm run gate:production
      - name: Stamp exact deployment SHA
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run generate:build-identity
      - name: Build production bundle without rerunning source sync
        run: npx vite build
      - name: Show generated build identity
        run: cat public/__falowen-admin-build.json

  verify-production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for Vercel Git deployment
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -u
          state="pending"
          description="Waiting for Vercel."
          for attempt in $(seq 1 12); do
            payload="$(curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/status")"
            state="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')"
            description="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].description // "Waiting for Vercel."')"
            echo "Vercel status: $state · $description"
            if [ "$state" = "success" ] || [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              break
            fi
            sleep 30
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel Git deployment"
            echo ""
            echo "- Commit: `$TARGET_SHA`"
            echo "- State: **$state**"
            echo "- Detail: $description"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retry with Vercel CLI when configured
        if: steps.vercel.outputs.state != 'success'
        id: cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured. Git integration remains the primary deploy path; scheduled rate-limit retry will use the Git retry marker."
            exit 0
          fi

          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify production contains this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            body="$(curl -fsS "$PRODUCTION_URL/api/deployment-status" 2>/dev/null || true)"
            deployed="$(printf '%s' "$body" | jq -r '.deployedSha // empty' 2>/dev/null || true)"
            main="$(printf '%s' "$body" | jq -r '.mainSha // empty' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            echo "Production status: ${status:-unavailable} · deployed=${deployed:-unknown} · main=${main:-unknown}"

            if [ "$status" = "current" ] && [ -n "$deployed" ]; then
              if [ "$deployed" = "$TARGET_SHA" ]; then
                {
                  echo "### Production verified"
                  echo ""
                  echo "admin.falowen.app is serving exact target SHA `$TARGET_SHA`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              compare="$(curl -fsS                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$deployed" 2>/dev/null || true)"
              relation="$(printf '%s' "$compare" | jq -r '.status // empty' 2>/dev/null || true)"
              ahead_by="$(printf '%s' "$compare" | jq -r '.ahead_by // 0' 2>/dev/null || echo 0)"

              if [ "$relation" = "ahead" ] && [ "$ahead_by" -gt 0 ]; then
                {
                  echo "### Production verified"
                  echo ""
                  echo "admin.falowen.app is serving newer descendant `$deployed`, which already contains target `$TARGET_SHA`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 20
          done

          echo "::error::Production did not reach target $TARGET_SHA or a newer descendant. Check the Vercel status above; rate-limited commits are retried by the hourly scheduled job after the cooldown."
          exit 1

  scheduled-rate-limit-retry:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Inspect latest main Vercel status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          payload="$(curl -fsS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$target_sha/status")"
          state="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
          description="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].description // ""')"
          created_at="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].created_at // ""')"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          {
            echo "### Scheduled production check"
            echo ""
            echo "- Main: `$target_sha`"
            echo "- Vercel: **$state**"
            echo "- Detail: ${description:-No Vercel status found.}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether rate-limit cooldown has elapsed
        id: cooldown
        if: steps.status.outputs.state == 'failure' && contains(steps.status.outputs.description, 'rate limited')
        env:
          CREATED_AT: ${{ steps.status.outputs.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CREATED_AT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          created_epoch="$(date -d "$CREATED_AT" +%s)"
          now_epoch="$(date +%s)"
          age_seconds="$((now_epoch - created_epoch))"
          if [ "$age_seconds" -ge 85800 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            remaining="$((85800 - age_seconds))"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel rate-limit cooldown still active for approximately $((remaining / 60)) more minutes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retry production with Vercel CLI when token is configured
        id: cli_retry
        if: steps.cooldown.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npm ci
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Create one Git retry commit when CLI credentials are unavailable
        if: steps.cooldown.outputs.ready == 'true' && steps.cli_retry.outputs.attempted != 'true'
        id: retry_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Falowen Production Bot"
          git config user.email "actions@users.noreply.github.com"
          printf 'Automated Vercel production retry.\nPrevious main: %s\nRequested: %s\n'             "$(git rev-parse HEAD)" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .vercel-production-retry.txt
          git add .vercel-production-retry.txt
          git commit -m "Retry Vercel production deployment"
          git push origin HEAD:main
          retry_sha="$(git rev-parse HEAD)"
          echo "sha=$retry_sha" >> "$GITHUB_OUTPUT"
          echo "Created retry commit `$retry_sha` after the Vercel cooldown." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify scheduled retry deployment
        if: steps.cli_retry.outputs.attempted == 'true' || steps.retry_commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.retry_commit.outputs.sha || steps.status.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS "$PRODUCTION_URL/api/deployment-status" 2>/dev/null || true)"
            deployed="$(printf '%s' "$body" | jq -r '.deployedSha // empty' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "$status" = "current" ] && [ -n "$deployed" ]; then
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                echo "Production retry succeeded for `$EXPECTED_SHA`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              compare="$(curl -fsS                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SHA...$deployed" 2>/dev/null || true)"
              relation="$(printf '%s' "$compare" | jq -r '.status // empty' 2>/dev/null || true)"
              ahead_by="$(printf '%s' "$compare" | jq -r '.ahead_by // 0' 2>/dev/null || echo 0)"
              if [ "$relation" = "ahead" ] && [ "$ahead_by" -gt 0 ]; then
                echo "Production retry target `$EXPECTED_SHA` is already included in newer production `$deployed`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::Scheduled production retry did not become current at the expected commit or a newer descendant."
          exit 1
