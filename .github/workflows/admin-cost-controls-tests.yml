name: Admin cost and refresh controls
on:
  pull_request:
    paths:
      - 'scripts/selectFirebaseDeployTargets.mjs'
      - '.github/workflows/deploy-firebase.yml'
      - 'src/hooks/useAdminRefresh.js'
      - 'src/utils/adminRefreshRequest.js'
      - 'src/components/AdminRefreshStatus.jsx'
      - 'src/components/StudentPaymentTools.jsx'
      - 'src/pages/MarkingPage.jsx'
      - 'tests/firebase-deploy-selection.test.js'
      - 'tests/admin-refresh-request.test.js'
      - '.github/workflows/admin-cost-controls-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/firebase-deploy-selection.test.js tests/admin-refresh-request.test.js tests/student-payment-listener-stability.test.js tests/cloud-cost-polling.test.js
