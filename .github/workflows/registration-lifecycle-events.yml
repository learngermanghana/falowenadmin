name: Registration Lifecycle Event Tests

on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'functions/registrationLifecycleEvents.js'
      - 'functions/trialAccessEmails.js'
      - 'api/integration-hub.js'
      - 'src/components/IntegrationEventPanel.jsx'
      - 'docs/apps-script/registration-lifecycle-webhook.gs'
      - 'docs/integration-event-hub.md'
      - 'tests/registration-lifecycle-events.test.js'
      - 'tests/trial-access-emails.test.js'
      - 'tests/integration-event-hub.test.js'
      - '.github/workflows/registration-lifecycle-events.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/index.js'
      - 'functions/registrationLifecycleEvents.js'
      - 'functions/trialAccessEmails.js'
      - 'api/integration-hub.js'
      - 'src/components/IntegrationEventPanel.jsx'
      - 'docs/apps-script/registration-lifecycle-webhook.gs'
      - 'docs/integration-event-hub.md'
      - 'tests/registration-lifecycle-events.test.js'
      - 'tests/trial-access-emails.test.js'
      - 'tests/integration-event-hub.test.js'
      - '.github/workflows/registration-lifecycle-events.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check registration lifecycle modules
        run: |
          node --check functions/registrationLifecycleEvents.js
          node --check functions/trialAccessEmails.js
          node --check functions/index.js
          node --check api/integration-hub.js
      - name: Run lifecycle regressions
        run: node --test tests/registration-lifecycle-events.test.js tests/trial-access-emails.test.js tests/integration-event-hub.test.js
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build Admin
        run: npm run build
