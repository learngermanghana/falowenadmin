name: Temp Presenter Review Fixes

on:
  push:
    branches:
      - agent/b1-presenter-v2-review-fixes

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Presenter 2 tests
        run: node --test tests/b1-presenter-v2-days1-6.test.js tests/teaching-presenter.test.js
      - name: Build production bundle
        run: npm run build
