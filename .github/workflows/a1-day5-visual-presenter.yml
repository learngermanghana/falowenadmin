name: A1 Day 5 visual presenter

on:
  pull_request:
    paths:
      - "src/components/A1Day5TeachingStage.jsx"
      - "src/components/A1Day5TeachingStage.css"
      - "src/components/A1Day5MusicReadingStage.jsx"
      - "src/components/A1GrammarPresenter.jsx"
      - "src/data/a1Day5Classroom.js"
      - "tests/a1-day5-visual-presenter.test.js"
      - "tests/a1-all-lessons-music.test.mjs"
      - ".github/workflows/a1-day5-visual-presenter.yml"

jobs:
  day5-visual-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check presenter and Day 5 JSX syntax
        run: |
          node --input-type=module -e "import { transformWithEsbuild } from 'vite'; import { readFileSync } from 'node:fs'; for (const file of ['src/components/A1GrammarPresenter.jsx', 'src/components/A1Day5TeachingStage.jsx', 'src/components/A1Day5MusicReadingStage.jsx']) { await transformWithEsbuild(readFileSync(file, 'utf8'), file, { loader: 'jsx', jsx: 'automatic' }); console.log(file + ' JSX syntax OK'); }"
      - name: Test 12-page Day 5 and original classroom contracts
        run: node --test tests/a1-day5-visual-presenter.test.js tests/a1-workbook-aligned-slides-days1-5.test.js tests/a1-days1-to5-understanding.test.js
      - name: Check build-safe A1 diagnostic stages
        run: node scripts/patchA1LanguageFirstFlow.mjs
