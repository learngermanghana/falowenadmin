name: Mock Builder A1–C2 quality

on:
  pull_request:
    paths:
      - "src/pages/MockBuilderPage*"
      - "src/utils/mockFactoryDraft.js"
      - "tests/mock-factory-draft.test.js"
      - "src/App.jsx"
      - "firestore.rules"
      - ".github/workflows/mock-builder-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/MockBuilderPage*"
      - "src/utils/mockFactoryDraft.js"
      - "tests/mock-factory-draft.test.js"
      - "src/App.jsx"
      - "firestore.rules"
      - ".github/workflows/mock-builder-quality.yml"

permissions:
  contents: read

jobs:
  draft-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test all six level drafts
        run: node --test tests/mock-factory-draft.test.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Falowen Admin
        run: npm run build
