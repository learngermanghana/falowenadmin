name: Marking foundation regressions

on:
  pull_request:
    paths:
      - 'src/utils/objectiveMarking.js'
      - 'src/utils/canonicalCourseReference.js'
      - 'tests/canonical-course-reference.test.js'
      - 'scripts/buildAutomaticMarking.mjs'
      - 'src/utils/writingTaskEvidence.js'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'src/services/markingService.js'
      - 'tests/a2-day13-day16-release-regression.test.js'
      - 'tests/fixtures/a2-day13-day16-submissions.json'
      - 'src/utils/submissionSections.js'
      - 'src/utils/writingRubric.js'
      - 'src/utils/writingFeedbackDepth.js'
      - 'src/data/answers_dictionary.json'
      - 'tests/golden-*.test.js'
      - 'tests/a1-6-versioned-workbook.test.js'
      - 'tests/a1-7-versioned-reading.test.js'
      - 'tests/a1-7-new-time-hoeren.test.js'
      - 'tests/a1-tutor-speaking-replacements.test.js'
      - 'tests/objective-marking.test.js'
      - 'functions/automaticCourseMarking.js'
      - 'functions/automaticCourseMarking.test.cjs'
      - 'functions/markingReliability.js'
      - 'functions/markingReliability.test.cjs'
      - 'functions/markingHealth.js'
      - 'functions/markingHealth.test.cjs'
      - 'src/components/AutomaticMarkingReview.jsx'
      - 'src/services/automaticMarkingReviewService.js'
      - 'tests/submission-sections.test.js'
      - 'tests/writing-rubric.test.js'
      - 'functions/automaticCourseMarking.js'
      - 'functions/automaticCourseMarking.test.cjs'
      - 'functions/markingReliability.js'
      - 'functions/markingReliability.test.cjs'
      - 'functions/markingHealth.js'
      - 'functions/markingHealth.test.cjs'
      - 'src/components/AutomaticMarkingReview.jsx'
      - 'src/services/automaticMarkingReviewService.js'
      - 'package.json'
      - '.github/workflows/marking-foundation.yml'
  push:
    branches:
      - improve/marking-foundation
      - main
    paths:
      - 'src/utils/objectiveMarking.js'
      - 'src/utils/canonicalCourseReference.js'
      - 'tests/canonical-course-reference.test.js'
      - 'scripts/buildAutomaticMarking.mjs'
      - 'src/utils/writingTaskEvidence.js'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'src/services/markingService.js'
      - 'tests/a2-day13-day16-release-regression.test.js'
      - 'tests/fixtures/a2-day13-day16-submissions.json'
      - 'src/utils/submissionSections.js'
      - 'src/utils/writingRubric.js'
      - 'src/utils/writingFeedbackDepth.js'
      - 'src/data/answers_dictionary.json'
      - 'tests/golden-*.test.js'
      - 'tests/submission-sections.test.js'
      - 'tests/writing-rubric.test.js'
      - 'functions/automaticCourseMarking.js'
      - 'functions/automaticCourseMarking.test.cjs'
      - 'functions/markingReliability.js'
      - 'functions/markingReliability.test.cjs'
      - 'functions/markingHealth.js'
      - 'functions/markingHealth.test.cjs'
      - 'src/components/AutomaticMarkingReview.jsx'
      - 'src/services/automaticMarkingReviewService.js'
      - 'package.json'
      - '.github/workflows/marking-foundation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate committed marking source without patch scripts
        run: |
          node --check functions/markingReliability.js
          node --check functions/markingHealth.js
          node --check functions/automaticCourseMarking.js
          node --check src/utils/objectiveMarking.js
          node --check src/utils/submissionSections.js
          node --check src/utils/writingRubric.js
          node --check src/utils/writingFeedbackDepth.js
      - name: Run direct marking goldens without npm pretest
        run: node --test tests/b1-day7-current-answer-key.test.js tests/a2-day16-relaxation-sync.test.js tests/a2-day13-day16-release-regression.test.js tests/submission-sections.test.js tests/writing-rubric.test.js tests/golden-known-submissions.test.js tests/golden-objective-coverage.test.js tests/a1-11-versioned-grading.test.js tests/a1-12.1-objective-parts.test.js tests/compact-objective-paste.test.js tests/a1-6-versioned-workbook.test.js tests/a1-7-versioned-reading.test.js tests/a1-7-new-time-hoeren.test.js tests/a1-tutor-speaking-replacements.test.js functions/automaticCourseMarking.test.cjs functions/markingReliability.test.cjs functions/markingHealth.test.cjs tests/canonical-course-reference.test.js tests/b1-day6-current-answer-key.test.js
      - name: Verify A1 Day 4 corrected number and speaking score
        run: node --test --test-name-pattern="A1 Day 4" tests/objective-marking.test.js
      - name: Verify bundled speaking release and objective regressions
        run: |
          node scripts/buildAutomaticMarking.mjs
          node --test functions/automaticMarkingPipeline.test.cjs
