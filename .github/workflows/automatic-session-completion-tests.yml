name: Automatic Session Completion Tests

on:
  pull_request:
    paths:
      - 'functions/autoCompleteClassSessions.js'
      - 'scripts/patchAutoCompleteClassSessions.mjs'
      - 'scripts/patchAutomaticSessionCompletionUi.mjs'
      - 'src/services/liveClassServiceBase.js'
      - 'src/pages/LiveClassesPageV2.jsx'
      - 'tests/auto-complete-class-sessions.test.js'
      - 'tests/automatic-session-completion-ui-patch.test.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
      - '.github/workflows/automatic-session-completion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'functions/autoCompleteClassSessions.js'
      - 'scripts/patchAutoCompleteClassSessions.mjs'
      - 'scripts/patchAutomaticSessionCompletionUi.mjs'
      - 'tests/auto-complete-class-sessions.test.js'
      - 'tests/automatic-session-completion-ui-patch.test.js'
      - 'package.json'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate scheduler and UI patches
        run: |
          node --check functions/autoCompleteClassSessions.js
          node --check scripts/patchAutoCompleteClassSessions.mjs
          node --check scripts/patchAutomaticSessionCompletionUi.mjs
          node scripts/patchAutoCompleteClassSessions.mjs
          node scripts/patchAutomaticSessionCompletionUi.mjs
          node --check functions/index.js
          grep -F 'exports.autoCompleteClassSessions = createAutoCompleteClassSessionsJob' functions/index.js
          grep -F 'schedule: "5 21 * * 1-6"' functions/autoCompleteClassSessions.js
          grep -F 'const classId = classIdForSession(session);' functions/autoCompleteClassSessions.js
          grep -F 'export async function undoSessionCompletion' src/services/liveClassServiceBase.js
          grep -F 'const canonicalClassId = String(classId || session.classRecordId || session.classId || "").trim();' src/services/liveClassServiceBase.js
          # The current workspace uses a dedicated Session Editor and Reopen action,
          # not the retired inline controls or costly 60-second polling.
          grep -F 'await markSessionCompleted(session.id, user?.uid || user?.email || "admin", dashboard?.klass?.id || selectedClassId);' src/pages/LiveClassesPageV2.jsx
          grep -F 'handleSessionAction(session, "reopen")' src/pages/LiveClassesPageV2.jsx
          grep -F 'initialAction={sessionChange.action}' src/pages/LiveClassesPageV2.jsx
          grep -F 'klass={dashboard.klass}' src/pages/LiveClassesPageV2.jsx
          grep -F 'session={editingSession}' src/pages/LiveClassesPageV2.jsx
          grep -F 'await refreshDashboard(selectedClassId);' src/pages/LiveClassesPageV2.jsx
          ! grep -F 'LIVE_CLASS_DASHBOARD_REFRESH_MS' src/pages/LiveClassesPageV2.jsx
      - name: Test completion eligibility and patch migration
        run: node --test tests/auto-complete-class-sessions.test.js tests/automatic-session-completion-ui-patch.test.js
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard with patched controls
        run: npm run build
