name: A1 Day 17 classroom slides
on:
  pull_request:
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/A1Day17ClassroomStage.*"
      - "src/data/a1Day17Classroom.js"
      - "src/data/a1LaterTeachingSlides.js"
      - "src/data/a1Days16To20Slides.js"
      - "tests/a1-day17-classroom-slides.test.js"
      - ".github/workflows/a1-day17-classroom-slides.yml"
  workflow_dispatch:
jobs:
  day17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Compile changed JSX
        run: |
          node --input-type=module -e "import { transformWithEsbuild } from 'vite'; import { readFileSync } from 'node:fs'; for (const file of ['src/components/A1Day17ClassroomStage.jsx', 'src/components/A1GrammarPresenter.jsx']) { await transformWithEsbuild(readFileSync(file, 'utf8'), file, { loader: 'jsx', jsx: 'automatic' }); console.log(file + ' JSX syntax OK'); }"
      - name: Verify Day 17 and existing presenter and workbook
        run: node --test tests/a1-day17-classroom-slides.test.js tests/a1-presenter-v2-all-lessons.test.js tests/a1-days16-to20-understanding.test.js tests/a1-11-versioned-grading.test.js
