name: Student Profile Update Tests

on:
  pull_request:
    paths:
      - 'src/services/studentsService.js'
      - 'functions/studentProfileUpdate.js'
      - 'scripts/patchStudentProfileUpdateApi.mjs'
      - 'tests/student-profile-update-api.test.js'
      - 'tests/students-service-admin.test.js'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/student-profile-update-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/services/studentsService.js'
      - 'functions/studentProfileUpdate.js'
      - 'scripts/patchStudentProfileUpdateApi.mjs'
      - 'tests/student-profile-update-api.test.js'
      - 'tests/students-service-admin.test.js'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/student-profile-update-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate Firebase route patch
        run: |
          node scripts/patchStudentProfileUpdateApi.mjs
          node scripts/patchStudentProfileUpdateApi.mjs
          node --check functions/studentProfileUpdate.js
          node --check functions/index.js
          grep -F 'const { registerStudentProfileUpdateRoute } = require("./studentProfileUpdate.js");' functions/index.js
          grep -F 'registerStudentProfileUpdateRoute({ app, db, admin, requireAuth });' functions/index.js
          test "$(grep -Fc 'registerStudentProfileUpdateRoute({ app, db, admin, requireAuth });' functions/index.js)" -eq 1
      - name: Verify deployment hooks retain the endpoint
        run: |
          grep -F 'node scripts/patchStudentProfileUpdateApi.mjs' firebase.json
          grep -F 'node scripts/patchStudentProfileUpdateApi.mjs' package.json
      - name: Test profile field allow-list
        run: node --test --test-name-pattern="sanitizer keeps" tests/student-profile-update-api.test.js
      - name: Test authenticated level and class update
        run: node --test --test-name-pattern="authenticated student profile route" tests/student-profile-update-api.test.js
      - name: Test missing student handling
        run: node --test --test-name-pattern="rejects unknown students" tests/student-profile-update-api.test.js
      - name: Test browser same-origin PATCH
        run: node --test --test-name-pattern="browser student update" tests/student-profile-update-api.test.js
      - name: Test undeployed endpoint message
        run: node --test --test-name-pattern="undeployed endpoint" tests/student-profile-update-api.test.js
      - name: Preserve existing student service helpers
        run: node --test tests/students-service-admin.test.js
