name: Student Profile Update Tests

on:
  pull_request:
    paths:
      - 'src/services/studentsService.js'
      - 'functions/studentProfileUpdate.js'
      - 'scripts/patchStudentProfileUpdateApi.mjs'
      - 'tests/student-profile-update-api.test.js'
      - 'tests/students-service-admin.test.js'
      - 'vite.config.js'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/student-profile-update-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/services/studentsService.js'
      - 'functions/studentProfileUpdate.js'
      - 'scripts/patchStudentProfileUpdateApi.mjs'
      - 'tests/student-profile-update-api.test.js'
      - 'tests/students-service-admin.test.js'
      - 'vite.config.js'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/student-profile-update-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and validate Firebase route patch
        run: |
          node scripts/patchStudentProfileUpdateApi.mjs
          node scripts/patchStudentProfileUpdateApi.mjs
          node --check functions/studentProfileUpdate.js
          node --check functions/index.js
          grep -F 'const { registerStudentProfileUpdateRoute } = require("./studentProfileUpdate.js");' functions/index.js
          grep -F 'registerStudentProfileUpdateRoute({ app, db, admin, requireAuth, staffEmails: teacherAllowlist });' functions/index.js
          test "$(grep -Fc 'registerStudentProfileUpdateRoute({ app, db, admin, requireAuth, staffEmails: teacherAllowlist });' functions/index.js)" -eq 1
      - name: Verify deployment and local-development hooks
        run: |
          grep -F 'node scripts/patchStudentProfileUpdateApi.mjs' firebase.json
          grep -F 'node scripts/patchStudentProfileUpdateApi.mjs' package.json
          grep -F "'/api'" vite.config.js
          grep -F 'https://us-central1-falowen-examiner-trainer.cloudfunctions.net' vite.config.js
      - name: Test staff-only atomic profile updates
        run: node --test tests/student-profile-update-api.test.js
      - name: Preserve existing student service helpers
        run: node --test tests/students-service-admin.test.js
