name: A1 Day 14 travel modal slides

on:
  pull_request:
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/A1Day14ClassroomStage.jsx"
      - "src/components/A1Day14ClassroomStage.css"
      - "src/data/a1Day14Classroom.js"
      - "src/data/a1Days11To15Slides.js"
      - "src/data/a1Days11To15Understanding.js"
      - "src/data/a1GenericLessonUpgrades.js"
      - "src/data/a1TopicTeacherSupport.js"
      - "tests/a1-day14-travel-modal-slides.test.js"
      - ".github/workflows/a1-day14-travel-modal-slides.yml"
  push:
    branches: [main]
    paths:
      - "src/components/A1GrammarPresenter.jsx"
      - "src/components/A1Day14ClassroomStage.jsx"
      - "src/data/a1Day14Classroom.js"
      - "tests/a1-day14-travel-modal-slides.test.js"
      - ".github/workflows/a1-day14-travel-modal-slides.yml"
  workflow_dispatch:

jobs:
  a1-day14:
    name: A1 Day 14 slide quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify presenter JSX compiles
        run: |
          node --input-type=module -e "import { transformWithEsbuild } from 'vite'; import { readFileSync } from 'node:fs'; for (const file of ['src/components/A1Day14ClassroomStage.jsx', 'src/components/A1GrammarPresenter.jsx']) { await transformWithEsbuild(readFileSync(file, 'utf8'), file, { loader: 'jsx', jsx: 'automatic' }); console.log(file + ' JSX syntax OK'); }"
      - name: Verify approved 12 pages, modal word order and workbook bridge
        run: node --test tests/a1-day14-travel-modal-slides.test.js
