name: Signup account lookup security

on:
  pull_request:
    paths:
      - "functions/signupAccountLookup.js"
      - "functions/signupAccountLookup.test.cjs"
      - "functions/index.js"
      - "src/components/SignupAccountLookup.jsx"
      - "src/pages/StudentDirectoryPage.jsx"
      - ".github/workflows/signup-account-lookup-security.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify backend syntax
        run: |
          node --check functions/signupAccountLookup.js
          node --check functions/index.js
      - name: Verify owner-only authentication and student profile lookups
        run: node --test functions/signupAccountLookup.test.cjs
