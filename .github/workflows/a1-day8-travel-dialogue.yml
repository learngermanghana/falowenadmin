name: A1 Day 8 travel dialogue slide

on:
  pull_request:
    paths:
      - "src/data/a1WorkbookAlignedSlidesDays6To10.js"
      - "src/utils/teachingPresenter.js"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "tests/a1-workbook-aligned-slides-days6-10.test.js"
      - ".github/workflows/a1-day8-travel-dialogue.yml"
  push:
    branches: [main]
    paths:
      - "src/data/a1WorkbookAlignedSlidesDays6To10.js"
      - "src/utils/teachingPresenter.js"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "tests/a1-workbook-aligned-slides-days6-10.test.js"
      - ".github/workflows/a1-day8-travel-dialogue.yml"

permissions:
  contents: read

jobs:
  a1-travel-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify A1 Day 8 lesson and presenter stage
        run: node --test tests/a1-workbook-aligned-slides-days6-10.test.js
      - name: Build Admin presentation interface
        run: npx vite build
