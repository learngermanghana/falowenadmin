name: Private Hören Studio checks
on:
  pull_request:
    paths:
      - "functions/hoerenStudioApi.js"
      - "functions/index.js"
      - "src/pages/HoerenStudioPage.jsx"
      - "src/pages/HoerenStudioPage.css"
      - "src/services/hoerenStudioService.js"
      - "src/utils/hoerenAudio.js"
      - "src/App.jsx"
      - "api/router.js"
      - "tests/hoeren-studio.test.js"
      - ".github/workflows/hoeren-studio-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check functions/hoerenStudioApi.js && node --check functions/index.js
      - run: node --test tests/hoeren-studio.test.js
      - run: npm run build
