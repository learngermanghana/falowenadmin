name: Patch A1-12.3 writing-only marking

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-a1-12-3-writing-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply placeholder writing protections
        run: |
          node scripts/patchA1WritingPlaceholderReferences.mjs
          node --check src/utils/autoMarking.js
          node --check src/utils/objectiveMarking.js
          node --check src/utils/answerKeyNormalizer.js
          node --check src/utils/naturalMarkingFeedback.js
          node --check api/router.js

      - name: Run A1-12.3 regressions
        run: |
          node --test tests/objective-question-form-choice.test.js
          node --test tests/a1-12.3-writing-only-regression.test.js

      - name: Commit permanent source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/autoMarking.js src/utils/objectiveMarking.js src/utils/answerKeyNormalizer.js src/utils/naturalMarkingFeedback.js api/router.js tests/a1-12.3-writing-only-regression.test.js
          git commit -m "Treat A1-12.3 placeholder key as writing only" || true
          git push || true

      - name: Verify production build
        run: npm run build
