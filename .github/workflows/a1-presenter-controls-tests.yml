name: A1 presenter interactive controls
on:
  pull_request:
    paths:
      - 'src/components/A1GrammarPresenter.jsx'
      - 'src/components/PresenterStudentPicker.jsx'
      - 'src/utils/presenterClassContext.js'
      - 'tests/a1-presenter-controls-runtime.test.mjs'
      - 'tests/presenter-class-context.test.js'
      - '.github/workflows/a1-presenter-controls-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/falowen-dom-tests" --no-audit --no-fund jsdom@26
      - run: npm run sync:build
      - name: Test real presenter and picker controls
        env:
          NODE_PATH: ${{ runner.temp }}/falowen-dom-tests/node_modules
        run: node --test tests/a1-presenter-controls-runtime.test.mjs tests/presenter-class-context.test.js
