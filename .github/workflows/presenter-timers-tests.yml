name: Presenter timer tests

on:
  pull_request:
    paths:
      - "src/components/PresenterSessionTimer.jsx"
      - "src/components/PresenterSessionTimer.css"
      - "src/components/PresenterStudentPicker.jsx"
      - "src/components/PresenterStudentPicker.css"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "src/components/A1GrammarPresenter.jsx"
      - "scripts/patchPresenterSessionAndResponseTimers.mjs"
      - "scripts/patchPresenterStudentAnswerTime60s.mjs"
      - "scripts/patchPresenterFullscreenViewport.mjs"
      - "scripts/patchPresenterAuthoritativeTimerSync.mjs"
      - "scripts/patchPresenterConceptLabels.mjs"
      - "tests/presenter-timers.test.js"
      - "tests/presenter-fullscreen-layout.test.js"
      - "tests/presenter-authoritative-timer-sync.test.js"
      - ".github/workflows/presenter-timers-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/components/PresenterSessionTimer.jsx"
      - "src/components/PresenterSessionTimer.css"
      - "src/components/TeachingSlidePresenter.css"
      - "scripts/patchPresenterSessionAndResponseTimers.mjs"
      - "scripts/patchPresenterStudentAnswerTime60s.mjs"
      - "scripts/patchPresenterFullscreenViewport.mjs"
      - "scripts/patchPresenterAuthoritativeTimerSync.mjs"
      - "scripts/patchPresenterConceptLabels.mjs"
      - "tests/presenter-timers.test.js"
      - "tests/presenter-fullscreen-layout.test.js"
      - "tests/presenter-authoritative-timer-sync.test.js"
      - ".github/workflows/presenter-timers-tests.yml"

jobs:
  timer-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply presenter patch chain
        run: |
          node scripts/patchPresenterStudentPicker.mjs
          node scripts/patchPresenterParticipationInsights.mjs
          node scripts/patchPresenterRandomAndAttendanceDiagnostics.mjs
          node scripts/patchPresenterConceptLabels.mjs
      - name: Run presenter regressions
        run: node --test tests/presenter-timers.test.js tests/presenter-fullscreen-layout.test.js tests/presenter-authoritative-timer-sync.test.js
      - name: Prepare waiting-room source for production bundle
        run: node scripts/patchCheckinWaitingRoomPlaylist.mjs
      - name: Build Vite bundle
        run: npx vite build
