name: Clarify Student Result README Once

on:
  push:
    branches:
      - agent/upsert-student-results-sheet
    paths:
      - 'scripts/clarifyStudentResultReadmeOnce.mjs'
      - '.github/workflows/clarify-student-result-readme-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upsert-student-results-sheet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/clarifyStudentResultReadmeOnce.mjs
      - name: Remove one-time migration files and commit README
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/clarifyStudentResultReadmeOnce.mjs
          rm .github/workflows/clarify-student-result-readme-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/clarifyStudentResultReadmeOnce.mjs .github/workflows/clarify-student-result-readme-once.yml
          git commit -m "Clarify score upsert fallback behavior" || exit 0
          git push origin HEAD:agent/upsert-student-results-sheet
