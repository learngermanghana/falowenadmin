name: Temporary compact normalization fix

on:
  push:
    branches:
      - fix/compact-objective-parsers

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-objective-parsers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused parser fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          parser = Path('src/utils/objectiveMarking.js')
          text = parser.read_text()
          old = '''function parseNumberedEntriesFromChunk(chunk = "") {
            const source = String(chunk || "")
              .trim()
              .replace(/(^|\\s)(\\d{1,3})(?=[A-FX](?:\\s|$))/gi, "$1$2.");
            if (!source) return [];
          '''
          new = '''function parseNumberedEntriesFromChunk(chunk = "") {
            const trimmed = String(chunk || "").trim();
            if (!trimmed) return [];

            const compactChoiceSequence = /^(?:\\d{1,3}\\s*[A-FX](?:\\s*[).,:–-])?)(?:\\s+\\d{1,3}\\s*[A-FX](?:\\s*[).,:–-])?)+$/i;
            const source = compactChoiceSequence.test(trimmed)
              ? trimmed.replace(/(^|\\s)(\\d{1,3})(?=[A-FX](?:\\s*[).,:–-]|\\s|$))/gi, "$1$2.")
              : trimmed;
          '''
          if old not in text:
              raise SystemExit('expected parser snippet not found')
          parser.write_text(text.replace(old, new, 1))

          test_file = Path('tests/objective-adjacent-choice-answers.test.js')
          test_text = test_file.read_text()
          regression = r'''

test("embedded identifiers such as Zimmer 2B are not parsed as another answer", () => {
  const embeddedIdentifierReference = {
    assignmentKey: "embedded-identifier-test",
    expectedParts: ["Teil 3"],
    parts: {
      "Teil 3": {
        answers: ["Zimmer 2B", "B) Zweite Antwort"],
      },
    },
  };

  const result = computeObjectiveScore(embeddedIdentifierReference, `Teil 3
1: Zimmer 2B`);

  assert.equal(result.totalCount, 2);
  assert.equal(result.correctCount, 1);
  assert.equal(result.details["teil3.1"].student, "Zimmer 2B");
  assert.equal(result.details["teil3.2"].student, "");
});
'''
          if 'embedded identifiers such as Zimmer 2B' not in test_text:
              test_file.write_text(test_text.rstrip() + regression + '\n')
          PY
      - name: Run objective parser tests
        run: node --test tests/objective-adjacent-choice-answers.test.js tests/compact-objective-paste.test.js tests/auto-marking.test.js
      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/temp-restrict-compact-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js tests/objective-adjacent-choice-answers.test.js .github/workflows/temp-restrict-compact-normalization.yml
          git commit -m "Restrict compact objective normalization"
          git push origin HEAD:fix/compact-objective-parsers
