name: A2 malformed writing score tests

on:
  pull_request:
    paths:
      - 'src/utils/finalDeterministicFeedback.js'
      - 'src/services/markingService.js'
      - 'src/utils/autoMarking.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchSharedWritingScoreRecovery.mjs'
      - 'tests/a2-malformed-teil-writing-score.test.js'
      - 'package.json'
      - '.github/workflows/a2-malformed-writing-score-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/utils/finalDeterministicFeedback.js'
      - 'src/services/markingService.js'
      - 'src/utils/autoMarking.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'scripts/patchSharedWritingScoreRecovery.mjs'
      - 'tests/a2-malformed-teil-writing-score.test.js'
      - 'package.json'
      - '.github/workflows/a2-malformed-writing-score-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared recovery patch twice
        run: |
          node scripts/patchSharedWritingScoreRecovery.mjs
          node scripts/patchSharedWritingScoreRecovery.mjs
      - name: Validate source
        run: |
          node --check src/utils/finalDeterministicFeedback.js
          node --check src/services/markingService.js
          node --check scripts/patchSharedWritingScoreRecovery.mjs
          node --check tests/a2-malformed-teil-writing-score.test.js
          grep -F 'maxWritingScore: 100' src/utils/finalDeterministicFeedback.js
          grep -F 'primary = recoverZeroWritingScore(primary, originalSubmissionText);' src/services/markingService.js
      - name: Run Diana A2-8.22 regression
        run: node --test tests/a2-malformed-teil-writing-score.test.js
