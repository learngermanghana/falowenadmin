name: B1 semantic writing marking tests

on:
  pull_request:
    paths:
      - 'src/data/b1WritingTaskSpecs.js'
      - 'src/utils/b1WritingTaskEvidence.js'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'tests/b1-semantic-writing-marking.test.js'
      - 'tests/question-aware-writing-marking.test.js'
      - 'src/services/markingService.js'
      - 'src/services/markingServiceBase.js'
      - 'scripts/patchSharedWritingScoreRecovery.mjs'
      - 'scripts/patchStructuredWritingEvidence.mjs'
      - 'package.json'
      - '.github/workflows/b1-semantic-writing-marking-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/data/b1WritingTaskSpecs.js'
      - 'src/utils/b1WritingTaskEvidence.js'
      - 'src/utils/questionAwareWritingMarking.js'
      - 'tests/b1-semantic-writing-marking.test.js'
      - 'tests/question-aware-writing-marking.test.js'
      - 'src/services/markingService.js'
      - 'src/services/markingServiceBase.js'
      - 'scripts/patchSharedWritingScoreRecovery.mjs'
      - 'scripts/patchStructuredWritingEvidence.mjs'
      - 'package.json'
      - '.github/workflows/b1-semantic-writing-marking-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply marking lifecycle twice
        run: |
          node scripts/patchSharedWritingScoreRecovery.mjs
          node scripts/patchSharedWritingScoreRecovery.mjs
          node scripts/patchStructuredWritingEvidence.mjs
          node scripts/patchStructuredWritingEvidence.mjs
      - name: Validate B1 semantic marking source
        run: |
          node --check src/data/b1WritingTaskSpecs.js
          node --check src/utils/b1WritingTaskEvidence.js
          node --check src/utils/questionAwareWritingMarking.js
          node --check tests/b1-semantic-writing-marking.test.js
      - name: Run semantic B1 regressions
        run: node --test tests/b1-semantic-writing-marking.test.js tests/question-aware-writing-marking.test.js
      - name: Build production bundle
        run: npm run build
