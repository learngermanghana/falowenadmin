name: Rebuild A1-12.1 automatic marking worker (fix branch)
on:
  push:
    branches:
      - fix/a1-12-1-bahnhof-worker-bundle-20261018
    paths:
      - .github/workflows/a1-121-rebuild-worker-branch.yml
      - functions/automaticMarkingPipeline.test.cjs
permissions:
  contents: write
jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a1-12-1-bahnhof-worker-bundle-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regenerate production Firebase marking pipeline using deployed source
        run: node scripts/buildAutomaticMarking.mjs --prepared
      - name: Assert the production worker contains the new workbook revision and grades it
        run: |
          grep -q 'BAHNHOF-HOEREN-V3' functions/automaticMarkingPipeline.cjs
          node --test functions/automaticMarkingPipeline.test.cjs
      - name: Commit regenerated deployed worker into the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/automaticMarkingPipeline.cjs
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Firebase automatic marking worker for A1-12.1 V3"
            git push origin "HEAD:fix/a1-12-1-bahnhof-worker-bundle-20261018"
          fi
