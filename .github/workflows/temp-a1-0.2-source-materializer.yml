        candidates.push([...blockAnswers, ...answers]);
      }
    }
  }
  const restartedGroups = splitIntoAnswerBlocks(submissionText)
''', 1)
          path.write_text(source)
          PY
          node --test tests/a1-0.2-unnumbered-text-block.test.js tests/a1-9-ans-prefix.test.js tests/objective-parser-format-matrix.test.js tests/golden-known-submissions.test.js
          node scripts/validateAnswerDictionary.mjs
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js
          git commit -m "Recover short unnumbered objective answer blocks"
          git push origin HEAD:fix/a1-0.2-safe-source
