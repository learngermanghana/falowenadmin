name: Verify retired Student Learning Nudge Worker

on:
  push:
    branches: [main]
    paths:
      - "functions/main.js"
      - ".github/workflows/deploy-student-learning-nudge.yml"
  workflow_dispatch:

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired worker cannot be deployed
        run: |
          node --check functions/main.js
          if grep -Eq 'module\.exports\.sendStudentLearningNudges\s*=' functions/main.js; then
            echo "Retired student learning nudge schedule must not be exported."
            exit 1
          fi
