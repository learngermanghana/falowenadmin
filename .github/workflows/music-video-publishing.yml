name: Music video publishing metadata

on:
  pull_request:
    paths:
      - 'src/utils/musicLyricsVideo.js'
      - 'src/components/MusicLyricsVideoStudio.jsx'
      - 'tests/music-lyrics-video.test.js'
      - 'tests/music-studio.test.js'
      - '.github/workflows/music-video-publishing.yml'
  push:
    branches: [main]
    paths:
      - 'src/utils/musicLyricsVideo.js'
      - 'src/components/MusicLyricsVideoStudio.jsx'
      - 'tests/music-lyrics-video.test.js'
      - 'tests/music-studio.test.js'
      - '.github/workflows/music-video-publishing.yml'

permissions:
  contents: read

jobs:
  metadata-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Admin dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # Some older lyric-production cases are maintained in their own suites.
      # This check specifically gates the upload-title/description regression cases.
      - name: Verify genre-aware music video publishing metadata
        run: node --test --test-name-pattern='export metadata follows|publishing copy keeps|song title and genre' tests/music-lyrics-video.test.js
