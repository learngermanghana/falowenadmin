name: A2 B1 weekly challenge tests

on:
  pull_request:
    paths:
      - "scripts/patchA2OneMinuteKnowledge.mjs"
      - "scripts/patchA2Day19ActionableRestore.mjs"
      - "scripts/patchB1ActionablePractice.mjs"
      - "scripts/patchA2B1ReflectiveWrapup.mjs"
      - "src/utils/teachingPresenter.js"
      - "src/data/a2WorkbookAlignedSlides.js"
      - "src/data/a2WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a2WorkbookAlignedSlidesDays11To15.js"
      - "src/data/a2WorkbookAlignedSlidesDays16To20.js"
      - "src/data/a2WorkbookAlignedSlidesDays21To24.js"
      - "src/data/a2WorkbookAlignedSlidesDays25To28.js"
      - "src/data/b1WorkbookAlignedSlidesDays1To10.js"
      - "src/data/b1WorkbookAlignedSlidesDays11To20.js"
      - "src/data/b1WorkbookAlignedSlidesDays21To28.js"
      - "tests/a2-b1-reflective-wrapup.test.js"
      - "package.json"
      - ".github/workflows/a2-b1-reflective-wrapup-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/patchA2B1ReflectiveWrapup.mjs"
      - "tests/a2-b1-reflective-wrapup.test.js"
      - "package.json"
      - ".github/workflows/a2-b1-reflective-wrapup-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply A2 and B1 presenter lifecycle
        run: |
          node scripts/patchA2OneMinuteKnowledge.mjs
          node scripts/patchA2Day19ActionableRestore.mjs
          node scripts/patchB1ActionablePractice.mjs
          node scripts/patchA2B1ReflectiveWrapup.mjs
          node scripts/patchA2B1ReflectiveWrapup.mjs
      - name: Validate weekly challenge source
        run: |
          node --check scripts/patchA2B1ReflectiveWrapup.mjs
          node --check src/utils/teachingPresenter.js
      - name: Run A2 B1 weekly challenge regressions
        run: node --test tests/a2-b1-reflective-wrapup.test.js
      - name: Build production bundle
        run: npm run build
