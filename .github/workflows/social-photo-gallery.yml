name: Social photo gallery checks

on:
  pull_request:
    paths:
      - "src/data/socialPhotoGallery.js"
      - "src/components/SocialPhotoGallery.jsx"
      - "src/components/SocialAdsDictionary.jsx"
      - "src/components/SocialVocabularyCreator.jsx"
      - "src/pages/SocialMediaPage.jsx"
      - "tests/social-photo-gallery.test.js"
      - ".github/workflows/social-photo-gallery.yml"
  push:
    branches: [main]
    paths:
      - "src/data/socialPhotoGallery.js"
      - "src/components/SocialPhotoGallery.jsx"
      - "src/components/SocialAdsDictionary.jsx"
      - "src/components/SocialVocabularyCreator.jsx"
      - "src/pages/SocialMediaPage.jsx"
      - "tests/social-photo-gallery.test.js"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate gallery data and integrations
        run: node --test tests/social-photo-gallery.test.js
      - name: Build social studio
        run: |
          npm ci --ignore-scripts
          npx vite build
