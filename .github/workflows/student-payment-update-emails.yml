name: Student Payment Update Email Tests

on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'functions/studentPaymentUpdateEmails.js'
      - 'scripts/patchStudentPaymentUpdateEmails.mjs'
      - 'tests/student-payment-update-emails.test.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/student-payment-update-emails.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/index.js'
      - 'functions/studentPaymentUpdateEmails.js'
      - 'scripts/patchStudentPaymentUpdateEmails.mjs'
      - 'tests/student-payment-update-emails.test.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/student-payment-update-emails.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Register payment email trigger
        run: node scripts/patchStudentPaymentUpdateEmails.mjs

      - name: Validate registration and syntax
        run: |
          node --check functions/studentPaymentUpdateEmails.js
          node --check functions/index.js
          grep -F 'onDocumentCreated, onDocumentUpdated' functions/index.js
          grep -F 'exports.sendStudentPaymentUpdateEmail = createStudentPaymentUpdateEmailTrigger' functions/index.js

      - name: Run payment email regressions
        run: node --test tests/student-payment-update-emails.test.js
