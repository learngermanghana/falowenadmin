name: Materialize marking source

on:
  push:
    branches:
      - improve/marking-foundation
    paths:
      - '.github/workflows/materialize-marking-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/marking-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move section parsing into committed source
        run: node scripts/refactorObjectiveSections.mjs
      - name: Validate committed parser source
        run: |
          node --check src/utils/submissionSections.js
          node --check src/utils/objectiveMarking.js
      - name: Commit refactored source
        run: |
          if git diff --quiet -- src/utils/objectiveMarking.js; then
            echo "No parser refactor changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js
          git commit -m "Use shared submission section parser"
          git push origin HEAD:improve/marking-foundation
