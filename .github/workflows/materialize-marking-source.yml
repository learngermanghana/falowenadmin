name: Materialize marking source

on:
  push:
    branches:
      - improve/marking-foundation
    paths:
      - '.github/workflows/materialize-marking-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/marking-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply objective marking patches once
        run: |
          node scripts/patchObjectiveWritingPartDetection.mjs
          node scripts/patchObjectiveAnswerTimeParsing.mjs
          node scripts/patchObjectivePromptAnswerParsing.mjs
          node scripts/patchA1PricePreferenceMarking.mjs
          node scripts/patchObjectiveSectionHeadingPunctuation.mjs
          node scripts/patchObjectiveGrammarConsistency.mjs
          node scripts/patchInlineObjectiveSectionAnswers.mjs
          node scripts/patchNumberedTextObjectiveSections.mjs
          node scripts/patchReorderedObjectiveGroups.mjs
          node scripts/patchSequentialMultipartIsolation.mjs
          node scripts/patchMultipartObjectiveAnswerBlocks.mjs
      - name: Validate materialized source
        run: node --check src/utils/objectiveMarking.js
      - name: Commit materialized source
        run: |
          if git diff --quiet -- src/utils/objectiveMarking.js; then
            echo "No objectiveMarking changes to materialize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/objectiveMarking.js
          git commit -m "Materialize objective marking source"
          git push origin HEAD:improve/marking-foundation
