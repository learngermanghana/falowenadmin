name: Materialize marking source

on:
  push:
    branches:
      - improve/marking-foundation
    paths:
      - '.github/workflows/materialize-marking-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/marking-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove legacy objective patch lifecycle steps
        run: node scripts/removeObjectivePatchLifecycle.mjs
      - name: Validate committed marking source
        run: |
          node --check src/utils/submissionSections.js
          node --check src/utils/objectiveMarking.js
          node --check src/utils/writingRubric.js
          node --check src/utils/writingFeedbackDepth.js
      - name: Commit lifecycle cleanup
        run: |
          if git diff --quiet -- package.json; then
            echo "No lifecycle cleanup changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Stop patching objective marking at runtime"
          git push origin HEAD:improve/marking-foundation
