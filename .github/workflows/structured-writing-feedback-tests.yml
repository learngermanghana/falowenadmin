name: Structured Writing Feedback Tests

on:
  pull_request:
    paths:
      - 'functions/index.js'
      - 'src/services/markingServiceBase.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'scripts/patchStructuredWritingEvidence.mjs'
      - 'scripts/patchSpecificWritingFeedback.mjs'
      - 'tests/structured-writing-evidence.test.js'
      - 'tests/specific-writing-feedback.test.js'
      - 'tests/essay-feedback-evidence.test.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
      - '.github/workflows/structured-writing-feedback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/index.js'
      - 'src/services/markingServiceBase.js'
      - 'src/utils/essayFeedbackEvidence.js'
      - 'src/utils/naturalMarkingFeedback.js'
      - 'scripts/patchStructuredWritingEvidence.mjs'
      - 'scripts/patchSpecificWritingFeedback.mjs'
      - 'tests/structured-writing-evidence.test.js'
      - 'tests/specific-writing-feedback.test.js'
      - 'tests/essay-feedback-evidence.test.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
      - '.github/workflows/structured-writing-feedback-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structured and specific feedback patches twice
        run: |
          node scripts/patchStructuredWritingEvidence.mjs
          node scripts/patchSpecificWritingFeedback.mjs
          node scripts/patchStructuredWritingEvidence.mjs
          node scripts/patchSpecificWritingFeedback.mjs
          node --check functions/index.js
          node --check src/services/markingServiceBase.js
          node --check src/utils/essayFeedbackEvidence.js
          node --check scripts/patchStructuredWritingEvidence.mjs
          node --check scripts/patchSpecificWritingFeedback.mjs
          grep -F 'specificAiWritingSentence' src/utils/essayFeedbackEvidence.js
          ! grep -F 'The main purpose of your message is understandable' src/utils/essayFeedbackEvidence.js
          ! grep -F 'Check verb position, articles and every task point before submitting' src/utils/essayFeedbackEvidence.js
      - name: Test Jeffrey original OpenAI evidence
        run: node --test --test-name-pattern="original specific OpenAI" tests/specific-writing-feedback.test.js
      - name: Test Jeffrey generic-response safeguard
        run: node --test --test-name-pattern="only generic writing text" tests/specific-writing-feedback.test.js
      - name: Test Fred evidence-based feedback
        run: node --test --test-name-pattern="Fred A2 feedback" tests/structured-writing-evidence.test.js
      - name: Test production field preservation
        run: node --test --test-name-pattern="production patch preserves" tests/structured-writing-evidence.test.js
      - name: Test existing essay evidence safeguards
        run: node --test tests/essay-feedback-evidence.test.js
