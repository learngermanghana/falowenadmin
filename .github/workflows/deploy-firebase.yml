name: Deploy Falowen Admin Firebase
# Scheduler cadences are cost-optimized; deploy current main configuration.

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/data/answers_dictionary.json'
      - 'src/data/a2WritingTaskSpecs.js'
      - 'src/utils/writingTaskEvidence.js'
      - 'scripts/**'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Deploy all existing function groups (for recovery or runtime configuration changes)"
        type: boolean
        default: true

concurrency:
  group: falowenadmin-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read

    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer
      CLOUD_RUNTIME_CONFIG: ${{ secrets.FALOWEN_ADMIN_CLOUD_RUNTIME_CONFIG || '{}' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show deployment revision
        run: |
          echo "Deploying commit $GITHUB_SHA from $GITHUB_REF_NAME"
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Find last successful Firebase deployment
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'deploy-firebase.yml',
              branch: 'main', status: 'success', per_page: 50,
            });
            // A skipped metadata-only run did not release functions and cannot
            // advance the baseline past an earlier failed deployment.
            let sha = '';
            for (const run of response.data.workflow_runs) {
              if (!['push', 'workflow_dispatch'].includes(run.event)) continue;
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: run.id });
              const released = jobs.data.jobs.some(job => job.steps?.some(step =>
                step.name === 'Deploy Firebase functions in quota-safe batches' && step.conclusion === 'success'));
              if (released) { sha = run.head_sha; break; }
            }
            core.setOutput('sha', sha);

      - name: Select affected Firebase functions
        id: plan
        env:
          FIREBASE_DEPLOY_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          FIREBASE_TRIGGER_BASE_SHA: ${{ github.event.before }}
          FIREBASE_FULL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_deploy }}
        run: node scripts/selectFirebaseDeployTargets.mjs

      - name: Validate Firebase predeploy patches
        if: steps.plan.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/patchStudentPaymentLinks.mjs \
            scripts/patchStudentPaymentHistoryApi.mjs \
            scripts/patchStudentPaymentAdminSecurity.mjs \
            scripts/patchStudentPaymentContractLifecycle.mjs \
            scripts/patchStudentUpgradePaymentDriven.mjs \
            scripts/patchStudentPaymentUpdateEmails.mjs \
            scripts/patchAutomaticOrientationSync.mjs \
            scripts/patchStructuredWritingEvidence.mjs \
            scripts/patchSpecificWritingFeedback.mjs \
            scripts/patchSheetRowManagementRoutes.mjs \
            scripts/patchOperationalSheetAutoSyncJobs.mjs \
            scripts/patchLiveClassUpdateScheduleSync.mjs \
            scripts/patchHolidayClassScheduleAwareness.mjs \
            scripts/patchStudentDeletionRuntime.mjs \
            scripts/patchAttendanceConfirmationEmails.mjs \
            scripts/patchAttendanceConfirmationEventDrivenV2.mjs \
            scripts/patchAttendanceParticipationSummaryEmail.mjs \
            scripts/patchAttendanceParticipationCanonicalIdentity.mjs \
            scripts/patchAttendanceNoParticipationEncouragement.mjs \
            scripts/patchAttendanceParticipationRecapGoals.mjs \
            scripts/patchAttendanceParticipationRecapFailSafe.mjs \
            scripts/patchAttendanceParticipationSessionWindow.mjs \
            scripts/patchAttendanceStructuredParticipationEmail.mjs \
            scripts/patchClassSessionReminderEmails.mjs \
            scripts/patchClassReminderDiagnosticBestEffort.mjs \
            scripts/patchClassReminderConciseLinks.mjs \
            scripts/patchCheckinStatusMetadataHydration.mjs \
            scripts/patchLeadClassStartReminderEmails.mjs \
            scripts/patchAutoCompleteClassSessions.mjs \
            scripts/patchCloudCostOptimizations.mjs \
            scripts/patchCourseReviewRequestEmails.mjs \
            scripts/patchGoetheExamConfig.mjs
          do
            echo "Checking $script"
            node --check "$script"
            node "$script"
          done
          node --check functions/index.js
          node --check functions/holidayNoticeRules.js
          node --check functions/main.js
          node --check functions/pendingStudentCleanup.js
          node --check functions/classSessionReminderEmails.js
          node --check functions/classSessionAutoCheckin.js
          node --check functions/autoCompleteClassSessions.js
          node --check functions/attendanceConfirmationEmails.js
          node --check functions/attendanceConfirmationRetry.js
          node --test --test-concurrency=1 tests/attendance-confirmation-retry.test.js tests/attendance-participation-summary-email.test.js tests/attendance-structured-participation-delivery.test.js
          grep -F 'attendance and participation summary' functions/attendanceConfirmationEmails.js
          grep -F 'await ref.set({ deliveryPayload }, { merge: true })' functions/attendanceConfirmationEmails.js
          node --check functions/completionParticipationDocument.js
          node --check functions/registrationLifecycleEvents.js
          node --check functions/trialAccessEmails.js
          node --check functions/finalMockResultEmails.js
          node --test tests/final-mock-result-emails.test.js
          node --test tests/completion-participation-document.test.js tests/completion-pack-admin-ui.test.js
          node --test tests/registration-lifecycle-events.test.js tests/trial-access-emails.test.js tests/brochure-whatsapp.test.js
          node --test functions/classEmailScheduling.test.js functions/attendanceSessionClassIdentity.test.js
          node --test tests/pending-student-cleanup.test.js
          node --test tests/student-payment-links.test.js tests/student-payment-listener-stability.test.js tests/student-payment-update-emails.test.js tests/student-contract-lifecycle.test.js tests/automatic-orientation-sync.test.js
          node --test tests/class-reminder-orientation-links.test.js tests/checkin-status-metadata-hydration.test.js
          grep -F 'app.post("/payments/create-link"' functions/index.js
          grep -F 'app.post("/payments/paystack-webhook"' functions/index.js
          grep -F 'app.get("/payments/student/:studentId"' functions/index.js
          grep -F 'app.post("/payments/start-upgrade"' functions/index.js
          grep -F 'app.post("/payments/reconcile-student/:studentId"' functions/index.js
          grep -F 'exports.maintainStudentPaymentContracts = onSchedule' functions/index.js
          grep -F 'schedule: "0 7,19 * * *"' functions/index.js
          grep -F 'schedule: "every 6 hours"' functions/index.js
          grep -F 'exports.autoSyncPaidStudentOrientation = onDocumentUpdated' functions/index.js
          grep -F 'exports.autoRemoveDeletedStudentFromOrientationSheet = onDocumentDeleted' functions/index.js
          grep -F 'exports.autoRemoveIneligibleStudentFromOrientationSheet = onDocumentUpdated' functions/index.js
          grep -F 'payment_or_active_trial_required' functions/index.js
          grep -F 'document: "payments/{reference}"' functions/index.js
          grep -F 'const paystackSecretKeySecret = defineSecret("PAYSTACK_SECRET")' functions/index.js
          grep -F 'writingStrengths:' functions/index.js
          grep -F 'taskCompletion:' functions/index.js
          grep -F 'Never invent a correction merely to fill a field' functions/index.js
          ! grep -F 'The main purpose of your message is understandable' src/utils/essayFeedbackEvidence.js
          ! grep -F 'Check verb position, articles and every task point before submitting' src/utils/essayFeedbackEvidence.js
          grep -F 'exports.sendClassSessionReminderEmails = createClassSessionReminderEmailJob' functions/index.js
          grep -F 'module.exports.cleanupExpiredPendingStudents = onSchedule' functions/main.js
          grep -F 'schedule: "0 3 * * *"' functions/main.js
          grep -F 'module.exports.sendClassSessionReminderEmails = onSchedule' functions/main.js
          grep -F 'schedule: "*/5 10-20 * * 1-5"' functions/main.js
          grep -F 'module.exports.sendSaturdayClassSessionReminderEmails = onSchedule' functions/main.js
          grep -F 'schedule: "*/5 6-10 * * 6"' functions/main.js
          grep -F 'class_session_reminder_skipped_outside_operating_window' functions/main.js
          grep -F 'exports.sendAttendanceConfirmationEmails = createAttendanceConfirmationEmailJob' functions/index.js
          grep -F 'exports.queueAttendanceConfirmationFromSession = onDocumentWritten' functions/index.js
          grep -F 'exports.queueAttendanceConfirmationFromCheckin = onDocumentWritten' functions/index.js
          grep -F 'exports.queueAttendanceConfirmationFromClassSession = onDocumentWritten' functions/index.js
          grep -F 'exports.sendLeadClassStartReminderEmails = createLeadClassStartReminderEmailJob' functions/index.js
          grep -F 'exports.autoCompleteClassSessions = createAutoCompleteClassSessionsJob' functions/index.js
          grep -F 'exports.sendCourseReviewRequestEmails = createCourseReviewRequestEmailJob' functions/index.js
          grep -F 'exports.sendDueHolidayNotices = onSchedule' functions/index.js
          grep -F 'exports.trackStudentRegistrationReceived = registrationLifecycleTriggers.registrationReceived' functions/index.js
          grep -F 'exports.sendEnrollmentConfirmationDocuments = registrationLifecycleTriggers.enrollmentConfirmed' functions/index.js
          grep -F 'exports.sendTrialAccessWelcomeEmail = createTrialAccessWelcomeEmailTrigger' functions/index.js
          grep -F 'exports.sendTrialAccessReminderEmails = createTrialAccessReminderEmailJob' functions/index.js
          grep -F 'exports.sendFinalMockResultEmail = createFinalMockResultEmailTrigger' functions/index.js
          grep -F 'module.exports.sendStudentLearningNudges = createStudentLearningNudgeJob' functions/main.js
          grep -F 'schedule: "*/5 10-20 * * 1-5"' functions/classSessionReminderEmails.js
          grep -F 'async function loadReminderSessionWindow' functions/classSessionReminderEmails.js
          grep -F 'async function loadStudentsForDueClasses' functions/classSessionReminderEmails.js
          ! grep -F 'db.collection("classSessions").get(),' functions/classSessionReminderEmails.js
          grep -F 'class_reminder_diagnostic_write_failed' functions/classSessionReminderEmails.js
          grep -F 'new URLSearchParams({ classId, sessionId })' functions/classSessionReminderEmails.js
          grep -F 'Open today’s Course Book:' functions/classSessionReminderEmails.js
          grep -F 'button_label: text(zoom.url || DEFAULT_CLASS_REMINDER_ZOOM.joinUrl) ? "Join Zoom" : ""' functions/classSessionReminderEmails.js
          grep -F '/^(tutorial|orientation|complete)$/i' functions/classSessionReminderEmails.js
          grep -F 'checkinMetadataHydrated: true' functions/index.js
          grep -F '.find((value) => /^\d{4}-\d{2}-\d{2}$/.test(value))' functions/index.js
          grep -F 'classStartsAt: startsAt.toISOString()' functions/classSessionAutoCheckin.js
          grep -F 'const resolvedAssignmentId' src/pages/CheckinPage.jsx
          grep -F 'Teacher presentation slides are not shared from the attendance page.' src/pages/CheckinPage.jsx
          grep -F 'schedule: "*/30 * * * *"' functions/attendanceConfirmationEmails.js
          grep -F 'async function queueAttendanceConfirmationEvent' functions/attendanceConfirmationEmails.js
          grep -F '.where("nextRunAt", "<=",' functions/attendanceConfirmationEmails.js
          ! grep -F 'const classSnap = await db.collection("classes").get();' functions/attendanceConfirmationEmails.js
          ! grep -F 'const studentSnap = await db.collection("students").get();' functions/attendanceConfirmationEmails.js
          grep -F 'acceptClassNameSessionMatch(session, klass)' functions/attendanceConfirmationEmails.js
          grep -F 'schedule: "0 8 * * *"' functions/leadClassStartReminderEmails.js
          grep -F 'schedule: "5 21 * * 1-6"' functions/autoCompleteClassSessions.js
          grep -F 'async function loadRecentCompletionCandidates' functions/autoCompleteClassSessions.js
          ! grep -F 'const snapshot = await db.collection("classSessions").get();' functions/autoCompleteClassSessions.js
          grep -F 'schedule: "0 10 * * *"' functions/courseReviewRequestEmails.js
          grep -F 'app.get("/exam-file/config"' functions/index.js
          grep -F 'app.put("/exam-file/config"' functions/index.js

      - name: Restore clean deployment source
        if: steps.plan.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          # Validation scripts intentionally patch tracked files in place. Firebase must start
          # its own predeploy pipeline from the committed source so hook ordering stays stable.
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Install shared marking build dependencies
        if: steps.plan.outputs.mode != 'skip'
        run: npm ci --ignore-scripts

      - name: Install functions dependencies
        if: steps.plan.outputs.mode != 'skip'
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        if: steps.plan.outputs.mode != 'skip'
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        if: steps.plan.outputs.mode != 'skip'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Deploy Firebase functions in quota-safe batches
        if: steps.plan.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          : > firebase-deploy.log

          deploy_group() {
            local label="$1"
            local only="$2"
            # The plan is outside the checkout so resets/cleanups cannot remove it.
            only="$(node --input-type=module - "$only" <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('/tmp/falowen-firebase-deploy-plan.json', 'utf8'));
          const targets = new Set(plan.targets);
          const selected = process.argv[2].split(',').filter(target =>
            plan.mode === 'full' || targets.has(target.split(':').at(-1)));
          process.stdout.write(selected.join(','));
          NODE
            )"
            if [ -z "$only" ]; then
              echo "Skipping unaffected group: ${label}" | tee -a firebase-deploy.log
              return
            fi
            echo "=== Deploying ${label} ===" | tee -a firebase-deploy.log
            # Every firebase deploy runs the repository predeploy patch chain. Restore tracked
            # files first so the next batch never re-applies patches to the previous batch's
            # already-mutated source. Keep untracked auth/log files intact.
            git reset --hard "$GITHUB_SHA" >> firebase-deploy.log 2>&1

            # Firebase Functions only receives runtime environment variables from
            # its dotenv/parameter configuration. The GitHub Actions environment
            # itself is not copied into the deployed function. Persist the existing
            # runtime-config secret as base64 so webhook URLs/tokens reach workers.
            runtime_config_b64="$(printf '%s' "$CLOUD_RUNTIME_CONFIG" | base64 -w0)"
            printf 'CLOUD_RUNTIME_CONFIG_B64=%s\n' "$runtime_config_b64" > "functions/.env.$FIREBASE_PROJECT_ID"

            # The score worker must share Admin's existing webhook and sheet selectors.
            # Firebase validates all declared secrets even for an API-only batch.
            node scripts/ensureScoreWebhookSecrets.mjs

            firebase deploy \
              --project "$FIREBASE_PROJECT_ID" \
              --only "$only" \
              --force \
              --debug 2>&1 | tee -a firebase-deploy.log
          }

          deploy_group "Falowen API" \
            "functions:falowenadmin:api"

          # Make consumers available before producers create automatic jobs.
          deploy_group "automatic course score Sheet sync worker" \
            "functions:falowenadmin:syncAutomaticCourseScore"

          deploy_group "automatic course marking worker" \
            "functions:falowenadmin:markCourseSubmissionAutomatically"

          deploy_group "assignment marking workers" \
            "functions:falowenadmin:createFlatSubmissionMarkingJob,functions:falowenadmin:createNestedSubmissionMarkingJob,functions:falowenadmin:createPostSubmissionMarkingJob"

          deploy_group "payment and contract workers" \
            "functions:falowenadmin:maintainStudentPaymentContracts,functions:falowenadmin:autoSyncPaidStudentOrientation,functions:falowenadmin:autoSyncNewStudentToOrientationSheet,functions:falowenadmin:autoRemoveIneligibleStudentFromOrientationSheet,functions:falowenadmin:autoRemoveDeletedStudentFromOrientationSheet,functions:falowenadmin:syncPendingOperationalSheets,functions:falowenadmin:cleanupExpiredPendingStudents"

          deploy_group "trial access email workers" \
            "functions:falowenadmin:sendTrialAccessWelcomeEmail,functions:falowenadmin:sendTrialAccessReminderEmails"

          deploy_group "final mock result email worker" \
            "functions:falowenadmin:sendFinalMockResultEmail"

          deploy_group "student learning nudge worker" \
            "functions:falowenadmin:sendStudentLearningNudges"

          # Cloud Run CPU quota is tight in us-central1. Deploy the attendance
          # worker first, then the other scheduled/event workers one at a time
          # so concurrent revision rollouts do not exhaust regional CPU quota.
          deploy_group "attendance confirmation worker" \
            "functions:falowenadmin:sendAttendanceConfirmationEmails"

          deploy_group "class reminder worker" \
            "functions:falowenadmin:sendClassSessionReminderEmails,functions:falowenadmin:sendSaturdayClassSessionReminderEmails"

          deploy_group "automatic class completion worker" \
            "functions:falowenadmin:autoCompleteClassSessions"

          deploy_group "holiday notice worker" \
            "functions:falowenadmin:sendDueHolidayNotices"

          deploy_group "attendance session event worker" \
            "functions:falowenadmin:queueAttendanceConfirmationFromSession"

          deploy_group "attendance check-in event worker" \
            "functions:falowenadmin:queueAttendanceConfirmationFromCheckin"

          deploy_group "class-session attendance event worker" \
            "functions:falowenadmin:queueAttendanceConfirmationFromClassSession"

      - name: Upload Firebase failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-log-${{ github.sha }}
          path: |
            firebase-deploy.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 3
