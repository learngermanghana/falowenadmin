name: Deploy Falowen Admin Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'scripts/**'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

concurrency:
  group: falowenadmin-firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FIREBASE_PROJECT_ID: falowen-examiner-trainer
      GOOGLE_CLOUD_PROJECT: falowen-examiner-trainer
      GCLOUD_PROJECT: falowen-examiner-trainer
      CLOUD_RUNTIME_CONFIG: ${{ secrets.FALOWEN_ADMIN_CLOUD_RUNTIME_CONFIG || '{}' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show deployment revision
        run: |
          echo "Deploying commit $GITHUB_SHA from $GITHUB_REF_NAME"
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Validate Firebase predeploy patches
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/patchStudentPaymentLinks.mjs \
            scripts/patchStudentPaymentHistoryApi.mjs \
            scripts/patchStudentPaymentAdminSecurity.mjs \
            scripts/patchStudentPaymentUpdateEmails.mjs \
            scripts/patchStructuredWritingEvidence.mjs \
            scripts/patchSpecificWritingFeedback.mjs \
            scripts/patchSheetRowManagementRoutes.mjs \
            scripts/patchOperationalSheetAutoSyncJobs.mjs \
            scripts/patchLiveClassUpdateScheduleSync.mjs \
            scripts/patchHolidayClassScheduleAwareness.mjs \
            scripts/patchStudentDeletionRuntime.mjs \
            scripts/patchAttendanceConfirmationEmails.mjs \
            scripts/patchClassSessionReminderEmails.mjs \
            scripts/patchClassReminderDiagnosticBestEffort.mjs \
            scripts/patchLeadClassStartReminderEmails.mjs \
            scripts/patchAutoCompleteClassSessions.mjs \
            scripts/patchCourseReviewRequestEmails.mjs \
            scripts/patchGoetheExamConfig.mjs
          do
            echo "Checking $script"
            node --check "$script"
            node "$script"
          done
          node --check functions/index.js
          node --test tests/student-payment-links.test.js tests/student-payment-listener-stability.test.js tests/student-payment-update-emails.test.js
          grep -F 'app.post("/payments/create-link"' functions/index.js
          grep -F 'app.post("/payments/paystack-webhook"' functions/index.js
          grep -F 'app.get("/payments/student/:studentId"' functions/index.js
          grep -F 'const paystackSecretKeySecret = defineSecret("PAYSTACK_SECRET")' functions/index.js
          grep -F 'writingStrengths:' functions/index.js
          grep -F 'taskCompletion:' functions/index.js
          grep -F 'Never invent a correction merely to fill a field' functions/index.js
          ! grep -F 'The main purpose of your message is understandable' src/utils/essayFeedbackEvidence.js
          ! grep -F 'Check verb position, articles and every task point before submitting' src/utils/essayFeedbackEvidence.js
          grep -F 'exports.sendClassSessionReminderEmails = createClassSessionReminderEmailJob' functions/index.js
          grep -F 'exports.sendLeadClassStartReminderEmails = createLeadClassStartReminderEmailJob' functions/index.js
          grep -F 'exports.autoCompleteClassSessions = createAutoCompleteClassSessionsJob' functions/index.js
          grep -F 'exports.sendCourseReviewRequestEmails = createCourseReviewRequestEmailJob' functions/index.js
          grep -F 'schedule: "*/5 * * * *"' functions/classSessionReminderEmails.js
          grep -F 'class_reminder_diagnostic_write_failed' functions/classSessionReminderEmails.js
          grep -F 'schedule: "0 8 * * *"' functions/leadClassStartReminderEmails.js
          grep -F 'schedule: "*/5 * * * *"' functions/autoCompleteClassSessions.js
          grep -F 'schedule: "0 10 * * *"' functions/courseReviewRequestEmails.js
          grep -F 'app.get("/exam-file/config"' functions/index.js
          grep -F 'app.put("/exam-file/config"' functions/index.js

      - name: Restore clean deployment source
        shell: bash
        run: |
          set -euo pipefail
          # Validation scripts intentionally patch tracked files in place. Firebase must start
          # its own predeploy pipeline from the committed source so hook ordering stays stable.
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALOWEN }}'

      - name: Deploy Falowen API and class reminder worker
        # Keep deployment targeted so unrelated scheduled functions do not hit the
        # regional Cloud Run CPU quota, while ensuring reminder-worker changes actually reach production.
        shell: bash
        run: |
          set -o pipefail
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:falowenadmin:api,functions:falowenadmin:sendClassSessionReminderEmails --force --debug 2>&1 | tee firebase-deploy.log

      - name: Upload Firebase failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-log-${{ github.sha }}
          path: |
            firebase-deploy.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 3
