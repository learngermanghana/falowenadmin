name: Apply richer writing feedback and mobile route splitting

on:
  push:
    branches:
      - fix/richer-writing-feedback-mobile-load

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/richer-writing-feedback-mobile-load
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch committed sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(source, search, replacement, label) {
            if (source.includes(replacement)) return source;
            if (!source.includes(search)) throw new Error(`${label} anchor not found`);
            return source.replace(search, replacement);
          }

          const essayPath = 'src/utils/essayFeedbackEvidence.js';
          let essay = fs.readFileSync(essayPath, 'utf8');
          if (!essay.includes('writingDepthSentences')) {
            essay = `import { writingDepthSentences } from "./writingFeedbackDepth.js";\n\n${essay}`;
          }
          essay = replaceOnce(
            essay,
            `  const optionalSentences = [\n    strengthOf(result, submissionText, level, seed, history),\n    taskSentence(result),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];`,
            `  const optionalSentences = [\n    ...writingDepthSentences(result, submissionText, level),\n    strengthOf(result, submissionText, level, seed, history),\n    taskSentence(result),\n    nextStepOf(result, submissionText, level, correction, seed, history),\n  ];`,
            'writing depth sentences',
          );
          essay = replaceOnce(
            essay,
            `  }, level === "B1" ? 75 : 60);`,
            `  }, level === "B1" ? 120 : level === "A2" ? 100 : 60);`,
            'A2/B1 feedback word budget',
          );
          fs.writeFileSync(essayPath, essay);

          const a2PatchPath = 'scripts/patchA2WritingFeedbackQuality.mjs';
          let a2Patch = fs.readFileSync(a2PatchPath, 'utf8');
          a2Patch = a2Patch.replace(/\nawait import\("\.\/patchB1WritingFeedbackDepth\.mjs"\);\s*$/m, '\n');
          fs.writeFileSync(a2PatchPath, a2Patch);
          if (fs.existsSync('scripts/patchB1WritingFeedbackDepth.mjs')) fs.rmSync('scripts/patchB1WritingFeedbackDepth.mjs');

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace('import { useState } from "react";', 'import { lazy, Suspense, useState } from "react";');

          const lazyPages = [
            ['DashboardPage', './pages/DashboardPage'],
            ['AttendanceOverviewPage', './pages/AttendanceOverviewPage'],
            ['AttendancePage', './pages/AttendancePage'],
            ['CanonicalAttendancePage', './pages/CanonicalAttendancePage.jsx'],
            ['CheckinPage', './pages/CheckinPage'],
            ['CheckinDisplayPage', './pages/CheckinDisplayPage'],
            ['CourseSchedulePage', './pages/CourseSchedulePage'],
            ['PublicCourseSchedulePage', './pages/PublicCourseSchedulePage'],
            ['MarkingHubPage', './pages/MarkingHubPage'],
            ['ExamTutorReviewQueuePage', './pages/ExamTutorReviewQueuePage'],
            ['TutorMarkingSimplePage', './pages/TutorMarkingSimplePage.jsx'],
            ['CommunicationHubPage', './pages/CommunicationHubPage.jsx'],
            ['GrammarIssueReportsPage', './pages/GrammarIssueReportsPage'],
            ['WhatsAppRemindersPage', './pages/WhatsAppRemindersPage'],
            ['TeachingSlidesPage', './pages/TeachingSlidesPage'],
            ['StudentDirectoryPage', './pages/StudentDirectoryPage'],
            ['StudentActivityPage', './pages/StudentActivityPage'],
            ['WritingSubmissionTrackerPage', './pages/WritingSubmissionTrackerPage'],
            ['OrientationPage', './pages/OrientationSetupTabsPage.jsx'],
            ['ClassScheduleSetupPage', './pages/ClassScheduleSetupPage'],
            ['ClassOperationsPage', './pages/ClassOperationsPage'],
            ['ClassArchivePage', './pages/ClassArchivePage'],
            ['LiveClassesPage', './pages/LiveClassesPage'],
            ['HolidayCalendarPage', './pages/HolidayCalendarPage'],
            ['GoetheExamConfigPage', './pages/GoetheExamConfigPage.jsx'],
            ['StudentResultsComparePage', './pages/StudentResultsComparePage.jsx'],
          ];
          for (const [name, specifier] of lazyPages) {
            const escaped = specifier.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            app = app.replace(new RegExp(`import ${name} from "${escaped}";\\n`), '');
          }
          app = app.replace('import LeadHomepageNotification from "./components/LeadHomepageNotification.jsx";\n', '');
          const lazyBlock = `\nconst LeadHomepageNotification = lazy(() => import("./components/LeadHomepageNotification.jsx"));\n${lazyPages.map(([name, specifier]) => `const ${name} = lazy(() => import("${specifier}"));`).join('\n')}\n`;
          if (!app.includes('const DashboardPage = lazy(')) {
            app = app.replace('import "./LiveClassesMobile.css";\n', `import "./LiveClassesMobile.css";\n${lazyBlock}`);
          }
          if (!app.includes('function RouteFallback()')) {
            app = app.replace('function TopBar() {', `function RouteFallback() {\n  return <div className="route-loading" role="status" aria-live="polite">Loading…</div>;\n}\n\nfunction TopBar() {`);
          }
          app = app.replace(
            '{showLeadNotification ? <LeadHomepageNotification /> : null}',
            '{showLeadNotification ? <Suspense fallback={null}><LeadHomepageNotification /></Suspense> : null}',
          );
          app = app.replace(
            '        <Routes>\n',
            '        <Suspense fallback={<RouteFallback />}>\n          <Routes>\n',
          );
          app = app.replace(
            '        </Routes>\n      </main>',
            '          </Routes>\n        </Suspense>\n      </main>',
          );
          fs.writeFileSync(appPath, app);
          NODE

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'Sources already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          git commit -m 'Improve A2 B1 feedback and split admin routes'
          git push origin HEAD:fix/richer-writing-feedback-mobile-load
