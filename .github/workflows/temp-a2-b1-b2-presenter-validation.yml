name: Temp A2 B1 B2 Presenter Validation

on:
  push:
    branches:
      - agent/a2-b1-b2-presenter-v2-all-days
    paths:
      - .github/workflows/temp-a2-b1-b2-presenter-validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run A2 B1 B2 presenter regressions
        run: node --test tests/a2-presenter-v2-all-days.test.js tests/b1-presenter-v2-days1-6.test.js tests/b1-presenter-v2-all-days.test.js tests/b2-presenter-v2-all-days.test.js tests/teaching-presenter.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/b1-workbook-aligned-slides-days11-20.test.js tests/b1-workbook-aligned-slides-days21-28.test.js
      - name: Build production bundle
        run: npm run build
