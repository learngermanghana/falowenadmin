name: Verify retired attendance confirmation workers

on:
  push:
    branches: [main]
    paths:
      - 'functions/attendanceConfirmationEmails.js'
      - 'functions/index.js'
      - 'scripts/patchAttendanceConfirmationEventDriven.mjs'
      - '.github/workflows/deploy-attendance-confirmation-worker.yml'
  pull_request:
    paths:
      - 'functions/attendanceConfirmationEmails.js'
      - 'functions/index.js'
      - 'scripts/patchAttendanceConfirmationEventDriven.mjs'
      - '.github/workflows/deploy-attendance-confirmation-worker.yml'
  workflow_dispatch:

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check functions/index.js && node --check functions/attendanceConfirmationEmails.js
      - run: node scripts/patchAttendanceConfirmationEventDriven.mjs
